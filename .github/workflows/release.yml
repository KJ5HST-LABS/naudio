name: Release

# Build, gate and publish binary packages (issue #93).
#
# Two triggers, one pipeline:
#   * push of a v* tag  — the release: every platform builds, the full suite runs,
#     the PACKAGES themselves are gated (not the build tree they came from), and
#     the artifacts land on a GitHub Release for that tag.
#   * workflow_dispatch — the DRY RUN: byte-identical jobs, artifacts land as
#     workflow artifacts only and no Release is touched. This is what makes the
#     pipeline provable without cutting a release — the tag path differs only in
#     the final attach job.
#
# Release shape (differs from ci.yml's development shape, deliberately):
#   * NAUDIO_BUNDLE_PORTAUDIO=ON — the FetchContent static PortAudio is linked
#     INTO libnaudio, so the package cannot silently grow a dependency on a
#     Homebrew/apt dylib just because the runner image has one (the same
#     determinism reasoning as the option's own comment in CMakeLists.txt).
#   * na_hamlib_bridge is deliberately NOT packaged, and no hamlib is embedded
#     or referenced: no released Hamlib provides the streaming API the bridge
#     needs, and shipping a frozen pre-release hamlib inside the binary would
#     put a second hamlib dialect beside applications that carry their own
#     (WSJT-class apps bundle one). The bridge stays fully built and tested
#     from source (ci.yml's bridge job); it returns to the packages linked
#     against the REAL released libhamlib the day one ships the streaming API
#     — tracked in the repo issue opened for exactly that event.
#   * Every self-containment claim is asserted on the ARTIFACT with ldd/otool,
#     never inferred from the configuration — a green build with the wrong
#     flags would otherwise ship the wrong package (Learning 9's shape).
#
# The per-platform package gates below are the issue's acceptance criterion:
# a PACKAGE-BASED install (unpacked tarball, dpkg -i, expanded zip) passes the
# same external-consumer commands ci.yml runs against a build-tree install.
#
# Double-clickable installers (operator-directed, S141): macOS ships a
# productbuild .pkg and Windows an NSIS setup .exe alongside the archives.
# Their payload is runtime+tools ONLY — no headers, no .pc, no CMake package
# (scoped at cpack time in cmake/CPackProjectConfig.cmake); the gates assert
# that absence as policy, with the archive trees as the positive control that
# the absence checks can fire. DEB/RPM already are Linux's double-clickable
# installers and are unchanged. Both installers are UNSIGNED: macOS needs
# right-click -> Open on first launch, Windows shows a SmartScreen warning —
# signing is a separate decision requiring certificates.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version-guard:
    name: tag matches PROJECT_VERSION
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare the pushed tag against project(naudio VERSION)
        run: |
          proj="$(sed -n 's/^ *VERSION \([0-9][0-9.]*\)$/\1/p' CMakeLists.txt | head -1)"
          echo "PROJECT_VERSION=${proj}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # Package files are named from PROJECT_VERSION, the Release from the
            # tag. If they disagree, v0.5.1 would publish artifacts named 0.5.0 —
            # caught here, before three platforms build them. A release
            # candidate is the numeric version plus an rcN suffix (project
            # VERSION is numeric-only by CMake's grammar, so the rc lives on
            # the tag and flows into the artifact names via
            # NAUDIO_PKG_VERSION_SUFFIX in each package job).
            case "${GITHUB_REF_NAME}" in
              "v${proj}")
                echo "tag ${GITHUB_REF_NAME} matches" ;;
              "v${proj}"rc[0-9] | "v${proj}"rc[0-9][0-9])
                echo "tag ${GITHUB_REF_NAME} matches (release candidate of ${proj})" ;;
              *)
                echo "::error::tag ${GITHUB_REF_NAME} != v${proj}[rcN] (CMakeLists.txt project VERSION)"; exit 1 ;;
            esac
          else
            echo "dispatch dry run — no tag to compare"
          fi

  package-macos:
    name: package (macos, TGZ + installer .pkg)
    runs-on: macos-latest
    needs: version-guard
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the suite's version-skew arm pins old headers out of history (ci.yml:66)

      - name: Derive the pre-release suffix from the tag (empty on final tags and dry runs)
        run: echo "NAUDIO_PKG_SUFFIX=$(echo "${GITHUB_REF_NAME}" | sed -n 's/^v[0-9.]*\(rc[0-9][0-9]*\)$/\1/p')" >> "$GITHUB_ENV"

      - name: Configure (release shape — no bridge, no hamlib; PortAudio bundled)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
                -DNAUDIO_BUNDLE_PORTAUDIO=ON \
                -DCMAKE_INSTALL_PREFIX=/usr/local \
                -DNAUDIO_PKG_VERSION_SUFFIX="${{ env.NAUDIO_PKG_SUFFIX }}"

      - name: Build
        run: cmake --build build -j

      - name: Assert the four shipped binaries were built — never the build's exit code
        run: |
          for t in tools/na_audio_daemon tools/na_wav_tap \
                   examples/na_audio_source examples/na_c_play_to_speakers; do
            test -x "build/$t" || { echo "::error::$t was not built"; exit 1; }
          done

      - name: Test (full suite)
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: cd build && cpack -G TGZ

      - name: "Package gate: unpack, consume, run, scan"
        run: |
          set -euo pipefail
          pkg=$(ls build/naudio-*.tar.gz)
          echo "package: $pkg"
          mkdir -p "${{ runner.temp }}/pkg"
          tar xzf "$pkg" -C "${{ runner.temp }}/pkg" --strip-components 1
          P="${{ runner.temp }}/pkg"

          # Tools run from the unpacked tree with NO library-path environment —
          # this is the relative-rpath contract the package relies on.
          "$P/bin/na_wav_tap" --help > /dev/null
          "$P/bin/na_audio_daemon" -h > /dev/null 2>&1
          "$P/bin/na_audio_source" --help > /dev/null
          "$P/bin/na_c_play_to_speakers" --help > /dev/null
          echo "all four shipped binaries run env-free from the package"

          # Self-containment: every load command outside @rpath//usr/lib//System
          # is a finding. Cardinality-checked (L230): exactly 5 binaries scanned
          # (2 tools + the demo pair + libnaudio). A bin/na_hamlib_bridge here
          # would trip the count — the bridge is deliberately not packaged.
          scanned=0
          for f in "$P"/bin/* "$P"/lib/libnaudio.*.*.*.dylib; do
            scanned=$((scanned+1))
            bad=$(otool -L "$f" | tail -n +2 | grep -v '@rpath\|/usr/lib/\|/System/' || true)
            if [ -n "$bad" ]; then echo "::error::$f references non-system libraries:"; echo "$bad"; exit 1; fi
          done
          [ "$scanned" -eq 5 ] || { echo "::error::expected to scan 5 binaries, scanned $scanned"; exit 1; }
          echo "otool scan clean over $scanned binaries"

          # The external-consumer gate, against the PACKAGE (find_package path).
          cmake -S tests/external-consumer -B consumer-build -DCMAKE_PREFIX_PATH="$P" > consumer.log 2>&1 \
            || { cat consumer.log; echo "::error::find_package(naudio) failed against the package"; exit 1; }
          grep -E 'external-consumer: naudio_pa arm (ENABLED|SKIPPED)' consumer.log
          cmake --build consumer-build -j > /dev/null
          DYLD_LIBRARY_PATH="$P/lib" ./consumer-build/consume_c   | tee -a consume.log
          DYLD_LIBRARY_PATH="$P/lib" ./consumer-build/consume_cxx | tee -a consume.log
          grep -q '^consume_c OK'   consume.log || { echo "::error::consume_c did not run"; exit 1; }
          grep -q '^consume_cxx OK' consume.log || { echo "::error::consume_cxx did not run"; exit 1; }

          # And the pkg-config path, relocated to wherever the tarball landed.
          cflags=$(PKG_CONFIG_PATH="$P/lib/pkgconfig" pkg-config --define-prefix --cflags naudio)
          libs=$(PKG_CONFIG_PATH="$P/lib/pkgconfig" pkg-config --define-prefix --libs naudio)
          cc $cflags tests/external-consumer/consume_c.c $libs -o consume_c_pc
          DYLD_LIBRARY_PATH="$P/lib" ./consume_c_pc | grep -q '^consume_c OK' \
            || { echo "::error::pkg-config consumer did not run"; exit 1; }
          echo "== macOS package gate: PASS =="

      - name: Package (installer — productbuild .pkg, runtime+tools payload)
        run: cd build && cpack -G productbuild

      - name: "Installer gate: install the .pkg for real, run, scan, assert dev files absent"
        run: |
          set -euo pipefail
          pkg=$(ls build/naudio-*.pkg)
          echo "installer: $pkg"

          # Positive control FIRST (L222): the dev-absence assertions below can
          # only mean something if the same paths exist in the full tree — the
          # TGZ tree gate 1 unpacked carries them.
          for present in include/naudio.h lib/pkgconfig/naudio.pc lib/libnaudio.dylib; do
            test -e "${{ runner.temp }}/pkg/$present" \
              || { echo "::error::control broken: TGZ tree lacks $present — absence checks prove nothing"; exit 1; }
          done

          # Control for the service-registration assertions below (L222): the
          # agent must be absent BEFORE the install, or its presence afterwards
          # proves nothing about who put it there.
          AGENT=/Library/LaunchAgents/org.kj5hst.naudio.daemon.plist
          test ! -e "$AGENT" \
            || { echo "::error::control broken: $AGENT existed before the install"; exit 1; }
          # Same control for the Applications shortcut (#96 item 4).
          APP="/Applications/naudio Control.app"
          test ! -e "$APP" \
            || { echo "::error::control broken: $APP existed before the install"; exit 1; }

          # THE install the deliverable promises: Installer.app's command-line
          # twin placing real files under /usr/local, receipt and all.
          sudo installer -pkg "$pkg" -target /
          pkgutil --pkgs | grep -c '^org\.kj5hst\.naudio\.' | grep -qx 2 \
            || { echo "::error::expected exactly the runtime+tools receipts"; pkgutil --pkgs | grep naudio; exit 1; }

          # The four binaries run from /usr/local/bin with no environment, and
          # the man pages landed beside them.
          /usr/local/bin/na_wav_tap --help > /dev/null
          /usr/local/bin/na_audio_daemon -h > /dev/null 2>&1
          /usr/local/bin/na_audio_source --help > /dev/null
          /usr/local/bin/na_c_play_to_speakers --help > /dev/null
          test -f /usr/local/share/man/man1/na_audio_daemon.1

          # otool self-containment on the INSTALLED files, cardinality 5 (L230).
          scanned=0
          for f in /usr/local/bin/na_wav_tap /usr/local/bin/na_audio_daemon \
                   /usr/local/bin/na_audio_source /usr/local/bin/na_c_play_to_speakers \
                   /usr/local/lib/libnaudio.*.*.*.dylib; do
            scanned=$((scanned+1))
            bad=$(otool -L "$f" | tail -n +2 | grep -v '@rpath\|/usr/lib/\|/System/' || true)
            if [ -n "$bad" ]; then echo "::error::$f references non-system libraries:"; echo "$bad"; exit 1; fi
          done
          [ "$scanned" -eq 5 ] || { echo "::error::expected to scan 5 installed binaries, scanned $scanned"; exit 1; }

          # Payload policy is runtime+tools ONLY — the absence half of the
          # control proven fireable above.
          for absent in /usr/local/include/naudio.h /usr/local/lib/pkgconfig/naudio.pc \
                        /usr/local/lib/cmake/naudio /usr/local/lib/libnaudio.dylib; do
            if [ -e "$absent" ]; then
              echo "::error::installer shipped dev file $absent — payload must be runtime+tools only"; exit 1; fi
          done

          # --- Service registration (#96 item 2): the postinstall ran ---------
          test -f "$AGENT" \
            || { echo "::error::the .pkg postinstall did not register the launchd agent"; exit 1; }
          plutil -lint "$AGENT" > /dev/null \
            || { echo "::error::the registered agent is not a valid plist"; exit 1; }

          # The agent must name a binary that this install actually placed. A
          # unit pointing at a path the package does not create is the whole
          # failure mode, and only the INSTALLED layout can answer it.
          exec_path=$(plutil -extract ProgramArguments.0 raw -o - "$AGENT")
          test -x "$exec_path" \
            || { echo "::error::agent names '$exec_path', which the install did not create"; exit 1; }

          # Installing must not start capturing a microphone at the next login.
          # Asserted AS POLICY, like the dev-file absence above.
          [ "$(plutil -extract Disabled raw -o - "$AGENT")" = "true" ] \
            || { echo "::error::the registered agent is not Disabled — install would auto-start"; exit 1; }

          # ...and it did not start one NOW either. An assertion of absence is
          # worth nothing from an instrument that finds nothing, so pgrep gets a
          # control built from the EXACT name searched for: a symlink to sleep,
          # run, observed, killed, and observed gone. Borrowing a system process
          # as the sentinel does NOT work — pgrep never matches PID 1, so
          # `pgrep -x launchd` fails on every Mac (measured). Nor does copying a
          # binary: an unsigned copy is killed on arm64.
          ctl_dir=$(mktemp -d)
          ln -s /bin/sleep "$ctl_dir/na_audio_daemon"
          "$ctl_dir/na_audio_daemon" 60 &
          ctl_pid=$!
          disown "$ctl_pid" 2>/dev/null || true
          seen=0
          for _ in 1 2 3 4 5; do
            if pgrep -x na_audio_daemon > /dev/null; then seen=1; break; fi
            sleep 1
          done
          [ "$seen" -eq 1 ] \
            || { echo "::error::control broken: pgrep cannot see a process named na_audio_daemon"; exit 1; }
          kill "$ctl_pid" 2>/dev/null || true
          gone=0
          for _ in 1 2 3 4 5; do
            if pgrep -x na_audio_daemon > /dev/null; then sleep 1; else gone=1; break; fi
          done
          # No `wait` here, deliberately: it would block until the stand-in ends
          # on its own, and a kill that silently failed could then never be
          # caught by the loop above — the assertion would be dead code.
          [ "$gone" -eq 1 ] \
            || { echo "::error::the control stand-in outlived its kill — the check below cannot run"; exit 1; }
          rm -rf "$ctl_dir"

          if pgrep -x na_audio_daemon > /dev/null; then
            echo "::error::the daemon is running after a bare install"; exit 1; fi

          # The agent logs to an absolute path (launchd expands neither ~ nor
          # $HOME), so the postinstall must have created that directory.
          log_dir=$(dirname "$(plutil -extract StandardErrorPath raw -o - "$AGENT")")
          test -d "$log_dir" \
            || { echo "::error::agent logs to $log_dir, which the postinstall did not create"; exit 1; }
          echo "launchd agent registered, inert, and pointing at $exec_path"

          # --- The control page (#96 item 4) ---------------------------------
          # The agent runs the daemon in CONTROL mode now, which is what makes
          # "enable the service" give an operator a page rather than an open
          # microphone. Asserted on the registered agent, not on the template.
          [ "$(plutil -extract ProgramArguments.1 raw -o - "$AGENT")" = "--mode" ] \
            && [ "$(plutil -extract ProgramArguments.2 raw -o - "$AGENT")" = "control" ] \
            || { echo "::error::the registered agent does not run --mode control"; exit 1; }

          # The Applications entry the postinstall copies out of the payload —
          # the shortcut #96's acceptance names, since macOS has no .desktop.
          test -d "$APP" \
            || { echo "::error::the .pkg postinstall did not place $APP"; exit 1; }
          plutil -lint "$APP/Contents/Info.plist" > /dev/null \
            || { echo "::error::$APP has an invalid Info.plist"; exit 1; }
          # A bundle whose executable is not executable is not opened by
          # LaunchServices, and it says nothing about why (configure_file writes
          # 0644, so this is the mode the CMake file(CHMOD) exists to fix).
          test -x "$APP/Contents/MacOS/naudio-control" \
            || { echo "::error::$APP's bundle executable is not executable"; exit 1; }
          # It must exec a binary this install actually placed.
          app_exec=$(sed -n 's/^exec "\([^"]*\)".*/\1/p' "$APP/Contents/MacOS/naudio-control")
          test -x "$app_exec" \
            || { echo "::error::$APP execs '$app_exec', which the install did not create"; exit 1; }

          # BEHAVIOUR on the installed binary: serve the page, fetch it, and
          # fetch the state the browser polls. Hardware-free — control mode
          # opens no device until asked, and nothing here asks.
          "$exec_path" --mode control --control-port 0 --autostart false \
                       --no-config --duration-ms 20000 > /tmp/ctl.log 2>&1 &
          ctl_daemon=$!
          url=""
          for _ in $(seq 1 50); do
            url=$(sed -n 's/^control page : //p' /tmp/ctl.log)
            [ -n "$url" ] && break
            sleep 0.2
          done
          [ -n "$url" ] || { echo "::error::the installed daemon served no control page"; cat /tmp/ctl.log; exit 1; }
          curl -fsS "$url" | grep -q 'naudio control' \
            || { echo "::error::the installed daemon's control page is not the control page"; exit 1; }
          curl -fsS "${url}api/state" | grep -q '"state":"idle"' \
            || { echo "::error::the installed daemon's /api/state did not report an idle pipeline"; exit 1; }
          # Control: the same fetch against a port with nothing on it must fail,
          # or the two assertions above would pass on any reachable machine.
          if curl -fsS --max-time 3 "http://127.0.0.1:1/" > /dev/null 2>&1; then
            echo "::error::control broken: a dead port answered"; exit 1; fi
          kill "$ctl_daemon" 2>/dev/null || true
          echo "installed daemon serves its control page and reports an idle pipeline"
          echo "== macOS installer gate: PASS =="

      - uses: actions/upload-artifact@v4
        with:
          name: package-macos
          path: |
            build/naudio-*.tar.gz
            build/naudio-*.pkg
          if-no-files-found: error

  package-linux:
    name: package (linux, TGZ + DEB + RPM)
    runs-on: ubuntu-latest
    needs: version-guard
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build deps (ALSA for the bundled PortAudio; rpm for cpack; NO portaudio19-dev)
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config build-essential rpm

      - name: Derive the pre-release suffix from the tag (empty on final tags and dry runs)
        run: echo "NAUDIO_PKG_SUFFIX=$(echo "${GITHUB_REF_NAME}" | sed -n 's/^v[0-9.]*\(rc[0-9][0-9]*\)$/\1/p')" >> "$GITHUB_ENV"

      - name: Configure (release shape — no bridge, no hamlib; prefix /usr so DEB/RPM metadata is truthful after install)
        run: |
          # CMAKE_INSTALL_LIBDIR is pinned: with prefix /usr on a Debian-family
          # host, GNUInstallDirs otherwise switches to the multiarch
          # lib/x86_64-linux-gnu — measured by this gate's first run, where the
          # tarball's lib/ globs went literal while the tools still ran (their
          # rpath derives from CMAKE_INSTALL_LIBDIR and followed it). A plain
          # lib/ keeps the relocatable tarball layout uniform across platforms,
          # and /usr/lib is a loader-trusted directory on both DEB and RPM
          # families (pkg-config's default search covers /usr/lib/pkgconfig on
          # Debian; on RPM distros the .pc needs PKG_CONFIG_PATH — a GitHub
          # convenience RPM, not distro-official packaging, per the issue's
          # non-goals).
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
                -DNAUDIO_BUNDLE_PORTAUDIO=ON \
                -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=lib \
                -DNAUDIO_PKG_VERSION_SUFFIX="${{ env.NAUDIO_PKG_SUFFIX }}"

      - name: Build
        run: cmake --build build -j

      - name: Assert the four shipped binaries were built — never the build's exit code
        run: |
          for t in tools/na_audio_daemon tools/na_wav_tap \
                   examples/na_audio_source examples/na_c_play_to_speakers; do
            test -x "build/$t" || { echo "::error::$t was not built"; exit 1; }
          done

      - name: Test (full suite)
        run: ctest --test-dir build --output-on-failure

      - name: Package (TGZ + DEB + RPM)
        run: cd build && cpack -G TGZ && cpack -G DEB && cpack -G RPM

      - name: "Package gate 1/3: tarball — unpack, consume, run, scan"
        run: |
          set -euo pipefail
          pkg=$(ls build/naudio-*.tar.gz)
          mkdir -p "${{ runner.temp }}/pkg"
          tar xzf "$pkg" -C "${{ runner.temp }}/pkg" --strip-components 1
          P="${{ runner.temp }}/pkg"

          "$P/bin/na_wav_tap" --help > /dev/null
          "$P/bin/na_audio_daemon" -h > /dev/null 2>&1
          "$P/bin/na_audio_source" --help > /dev/null
          "$P/bin/na_c_play_to_speakers" --help > /dev/null
          echo 'all four shipped binaries run env-free from the tarball ($ORIGIN rpath)'

          # Self-containment: no hamlib/portaudio/samplerate/libusb reference and
          # no unresolvable library. libasound &co are fine — they are what
          # dpkg-shlibdeps declares. The hamlib term now guards the operator
          # decision directly: NOTHING in the package may reference any hamlib.
          # Cardinality-checked: exactly 5 binaries (2 tools + the demo pair +
          # libnaudio) — a packaged bridge would trip the count.
          scanned=0
          for f in "$P"/bin/* "$P"/lib/libnaudio.so.*.*; do
            scanned=$((scanned+1))
            ldd "$f" > ldd.out
            if grep -Ei 'hamlib|portaudio|samplerate|libusb' ldd.out; then
              echo "::error::$f references a library the package must not depend on"; exit 1; fi
            if grep -F 'not found' ldd.out | grep -v 'libnaudio'; then
              echo "::error::$f has unresolvable dependencies"; exit 1; fi
          done
          [ "$scanned" -eq 5 ] || { echo "::error::expected to scan 5 binaries, scanned $scanned"; exit 1; }
          echo "ldd scan clean over $scanned binaries"

          cmake -S tests/external-consumer -B consumer-build -DCMAKE_PREFIX_PATH="$P" > consumer.log 2>&1 \
            || { cat consumer.log; echo "::error::find_package(naudio) failed against the tarball"; exit 1; }
          grep -E 'external-consumer: naudio_pa arm (ENABLED|SKIPPED)' consumer.log
          cmake --build consumer-build -j > /dev/null
          LD_LIBRARY_PATH="$P/lib" ./consumer-build/consume_c   | tee -a consume.log
          LD_LIBRARY_PATH="$P/lib" ./consumer-build/consume_cxx | tee -a consume.log
          grep -q '^consume_c OK'   consume.log || { echo "::error::consume_c did not run"; exit 1; }
          grep -q '^consume_cxx OK' consume.log || { echo "::error::consume_cxx did not run"; exit 1; }

          cflags=$(PKG_CONFIG_PATH="$P/lib/pkgconfig" pkg-config --define-prefix --cflags naudio)
          libs=$(PKG_CONFIG_PATH="$P/lib/pkgconfig" pkg-config --define-prefix --libs naudio)
          cc $cflags tests/external-consumer/consume_c.c $libs -o consume_c_pc
          LD_LIBRARY_PATH="$P/lib" ./consume_c_pc | grep -q '^consume_c OK' \
            || { echo "::error::pkg-config consumer did not run"; exit 1; }
          echo "== tarball gate: PASS =="

      - name: "Package gate 2/3: DEB — actually install it, then consume /usr"
        run: |
          set -euo pipefail
          # THE package-based install the acceptance criterion asks for: the real
          # package manager placing real files under /usr, not an unpacked image.
          sudo apt-get install -y ./build/naudio-*.deb
          sudo ldconfig
          dpkg -s naudio | sed -n '1,8p'

          na_wav_tap --help > /dev/null
          na_audio_daemon -h > /dev/null 2>&1
          na_audio_source --help > /dev/null
          na_c_play_to_speakers --help > /dev/null
          if command -v na_hamlib_bridge > /dev/null; then
            echo "::error::na_hamlib_bridge was installed by the DEB — the bridge must not be packaged"; exit 1; fi
          echo "all four shipped binaries run from /usr/bin (and the bridge is absent, as intended)"

          cmake -S tests/external-consumer -B deb-consumer > deb-consumer.log 2>&1 \
            || { cat deb-consumer.log; echo "::error::find_package(naudio) failed against the installed DEB"; exit 1; }
          cmake --build deb-consumer -j > /dev/null
          ./deb-consumer/consume_c   | tee -a deb-consume.log
          ./deb-consumer/consume_cxx | tee -a deb-consume.log
          grep -q '^consume_c OK'   deb-consume.log || { echo "::error::consume_c did not run"; exit 1; }
          grep -q '^consume_cxx OK' deb-consume.log || { echo "::error::consume_cxx did not run"; exit 1; }

          # /usr/lib/pkgconfig is on pkg-config's default path — no env needed.
          cc $(pkg-config --cflags naudio) tests/external-consumer/consume_c.c \
             $(pkg-config --libs naudio) -o deb_consume_c_pc
          ./deb_consume_c_pc | grep -q '^consume_c OK' \
            || { echo "::error::pkg-config consumer did not run against the DEB"; exit 1; }

          # --- Service registration (#96 item 2) ------------------------------
          # The DEB carries the unit itself — no postinst needed, unlike the
          # .pkg, because /usr/lib/systemd/user IS under the package prefix.
          UNIT=/usr/lib/systemd/user/naudio-daemon.service
          test -f "$UNIT" || { echo "::error::the DEB did not install $UNIT"; exit 1; }

          # It must name a binary the package actually placed — the failure a
          # build-tree test structurally cannot see.
          unit_exec=$(sed -n 's/^ExecStart=\([^ ]*\).*/\1/p' "$UNIT")
          test -x "$unit_exec" \
            || { echo "::error::unit names '$unit_exec', which the DEB did not install"; exit 1; }

          # Installing must not start capturing a microphone at the next login:
          # the unit ships AVAILABLE, never enabled. Absence needs a control, so
          # the wants directory is first proven to be where an enable would land.
          grep -q '^WantedBy=default.target$' "$UNIT" \
            || { echo "::error::control broken: unit does not install into default.target"; exit 1; }
          for w in /etc/systemd/user/default.target.wants "$HOME/.config/systemd/user/default.target.wants"; do
            if [ -e "$w/naudio-daemon.service" ]; then
              echo "::error::the DEB enabled the service — it must ship available, not enabled"; exit 1; fi
          done
          # The unit runs CONTROL mode (#96 item 4), which is what makes
          # enabling the service give an operator a page rather than an open
          # microphone. Asserted on the INSTALLED unit, not on the template.
          grep -q '^ExecStart=.* --mode control ' "$UNIT" \
            || { echo "::error::the installed unit does not run --mode control"; sed -n '/^ExecStart=/p' "$UNIT"; exit 1; }
          echo "systemd user unit installed at $UNIT, not enabled, pointing at $unit_exec"

          # --- The control page (#96 item 4) ---------------------------------
          # The desktop entry: the shortcut #96's acceptance names. Unlike the
          # unit it needs no postinst either — share/applications is under /usr.
          DESKTOP=/usr/share/applications/naudio-control.desktop
          test -f "$DESKTOP" || { echo "::error::the DEB did not install $DESKTOP"; exit 1; }
          if command -v desktop-file-validate > /dev/null; then
            desktop-file-validate "$DESKTOP" \
              || { echo "::error::$DESKTOP is not a valid desktop entry"; exit 1; }
          else
            echo "note: no desktop-file-validate on this runner; structure not validated"
          fi
          # It must launch a binary the package actually placed, in control mode.
          desktop_exec=$(sed -n 's/^Exec=\([^ ]*\).*/\1/p' "$DESKTOP")
          test -x "$desktop_exec" \
            || { echo "::error::$DESKTOP execs '$desktop_exec', which the DEB did not install"; exit 1; }
          grep -q '^Exec=.* --mode control ' "$DESKTOP" \
            || { echo "::error::$DESKTOP does not launch control mode"; exit 1; }

          # BEHAVIOUR on the installed binary: serve the page and answer the
          # poll the browser makes. Hardware-free — nothing here starts a stream.
          "$unit_exec" --mode control --control-port 0 --autostart false \
                       --no-config --duration-ms 20000 > /tmp/ctl.log 2>&1 &
          ctl_daemon=$!
          url=""
          for _ in $(seq 1 50); do
            url=$(sed -n 's/^control page : //p' /tmp/ctl.log)
            [ -n "$url" ] && break
            sleep 0.2
          done
          [ -n "$url" ] || { echo "::error::the installed daemon served no control page"; cat /tmp/ctl.log; exit 1; }
          curl -fsS "$url" | grep -q 'naudio control' \
            || { echo "::error::the installed daemon's control page is not the control page"; exit 1; }
          curl -fsS "${url}api/state" | grep -q '"state":"idle"' \
            || { echo "::error::the installed daemon's /api/state did not report an idle pipeline"; exit 1; }
          # Control: a port with nothing on it must NOT answer, or the two
          # assertions above would pass anywhere.
          if curl -fsS --max-time 3 "http://127.0.0.1:1/" > /dev/null 2>&1; then
            echo "::error::control broken: a dead port answered"; exit 1; fi
          kill "$ctl_daemon" 2>/dev/null || true
          echo "installed daemon serves its control page and reports an idle pipeline"
          echo "== DEB gate: PASS =="

      - name: "Package gate 3/3: RPM — content assertions (no rpm host here to install on)"
        run: |
          set -euo pipefail
          rpm=$(ls build/naudio-*.rpm)
          rpm -qlp "$rpm" > rpm-contents.txt
          for want in /usr/bin/na_audio_daemon /usr/bin/na_wav_tap \
                      /usr/bin/na_audio_source /usr/bin/na_c_play_to_speakers \
                      /usr/include/naudio.h /usr/lib/pkgconfig/naudio.pc \
                      /usr/lib/systemd/user/naudio-daemon.service \
                      /usr/share/applications/naudio-control.desktop; do
            grep -qx "$want" rpm-contents.txt \
              || { echo "::error::RPM is missing $want"; cat rpm-contents.txt; exit 1; }
          done
          if grep -q 'na_hamlib_bridge' rpm-contents.txt; then
            echo "::error::RPM carries na_hamlib_bridge — the bridge must not be packaged"; exit 1; fi
          echo "RPM carries the four binaries, the header and the pkgconfig file; no bridge"

      - uses: actions/upload-artifact@v4
        with:
          name: package-linux
          path: |
            build/naudio-*.tar.gz
            build/naudio-*.deb
            build/naudio-*.rpm
          if-no-files-found: error

  package-windows:
    name: package (windows, ZIP + installer .exe — lib + headers + the daemon + na_wav_tap + the demo pair)
    runs-on: windows-latest
    needs: version-guard
    steps:
      - uses: actions/checkout@v4

      - name: Derive the pre-release suffix from the tag (empty on final tags and dry runs)
        shell: bash
        run: echo "NAUDIO_PKG_SUFFIX=$(echo "${GITHUB_REF_NAME}" | sed -n 's/^v[0-9.]*\(rc[0-9][0-9]*\)$/\1/p')" >> "$GITHUB_ENV"

      - name: Configure (bundled PortAudio; apps ON so na_wav_tap ships — ci.yml's windows-wav-tap rationale)
        run: cmake -S . -B build -DNAUDIO_BUNDLE_PORTAUDIO=ON -DNAUDIO_PKG_VERSION_SUFFIX="${{ env.NAUDIO_PKG_SUFFIX }}"

      - name: Build
        run: cmake --build build --config Release -j

      - name: Test (full suite)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        run: cd build; cpack -G ZIP -C Release

      - name: "Package gate: expand, consume, run"
        shell: pwsh
        run: |
          $zip = Get-ChildItem build/naudio-*.zip | Select-Object -First 1
          if (-not $zip) { Write-Output "::error::no ZIP produced"; exit 1 }
          Expand-Archive $zip.FullName -DestinationPath "${{ runner.temp }}/pkgroot"
          $P = Get-ChildItem "${{ runner.temp }}/pkgroot" | Select-Object -First 1

          # The shipped Windows binaries. naudio.dll sits beside them in bin/.
          #
          # na_audio_daemon joined them in this release (issue #96 item 3): until its WIN32 build
          # gate came off, the Windows package carried a client and a demo but not the thing an
          # operator actually configures and runs.
          & "$($P.FullName)/bin/na_audio_daemon.exe" --help
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::na_audio_daemon.exe from the package will not run"; exit 1 }
          & "$($P.FullName)/bin/na_wav_tap.exe" --help
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::na_wav_tap.exe from the package will not run"; exit 1 }
          & "$($P.FullName)/bin/na_audio_source.exe" --help
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::na_audio_source.exe from the package will not run"; exit 1 }
          & "$($P.FullName)/bin/na_c_play_to_speakers.exe" --help
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::na_c_play_to_speakers.exe from the package will not run"; exit 1 }

          # Runtime proof ON THE ARTIFACT: test-tone server -> null-backend client,
          # byte-tell asserted (examples/README.md) — no audio device involved.
          $srv = Start-Process -PassThru -NoNewWindow -FilePath "$($P.FullName)/bin/na_audio_source.exe" `
                 -ArgumentList '--test-tone','--seconds','25'
          Start-Sleep -Seconds 3
          & "$($P.FullName)/bin/na_c_play_to_speakers.exe" --backend null --seconds 5 2>&1 |
            Tee-Object -FilePath demo.log
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::demo client exited $LASTEXITCODE"; exit 1 }
          if (-not (Select-String -Path demo.log -Pattern 'first_frame_hex=68c569c66ac76bc8' -Quiet)) {
            Write-Output "::error::stream byte-tell missing — the packaged pair did not stream"; exit 1 }
          Stop-Process -Id $srv.Id -ErrorAction SilentlyContinue
          Write-Output "packaged demo pair streams end to end on Windows"

          cmake -S tests/external-consumer -B consumer-build -DCMAKE_PREFIX_PATH="$($P.FullName)" 2>&1 |
            Tee-Object -FilePath consumer.log
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::find_package(naudio) failed against the ZIP"; exit 1 }
          if (-not (Select-String -Path consumer.log -Pattern 'naudio_pa arm SKIPPED' -Quiet)) {
            Write-Output "::error::expected the naudio_pa arm to be SKIPPED on a host with no PortAudio"; exit 1
          }
          cmake --build consumer-build --config Release
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::consumer build failed"; exit 1 }

          $env:PATH = "$($P.FullName)/bin;" + $env:PATH
          & "consumer-build/Release/consume_c.exe"   2>&1 | Tee-Object -FilePath consume.log
          & "consumer-build/Release/consume_cxx.exe" 2>&1 | Tee-Object -FilePath consume.log -Append
          if (-not (Select-String -Path consume.log -Pattern '^consume_c OK' -Quiet)) {
            Write-Output "::error::consume_c did not run"; exit 1 }
          if (-not (Select-String -Path consume.log -Pattern '^consume_cxx OK' -Quiet)) {
            Write-Output "::error::consume_cxx did not run"; exit 1 }
          Write-Output "== Windows package gate: PASS =="

      - name: Ensure NSIS is present (NOT in the windows-latest image — measured 2026-08-31; choco shims nothing for makensis, so PATH gains the install dir)
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
            $nsis = 'C:\Program Files (x86)\NSIS'
            if (-not (Test-Path "$nsis\makensis.exe")) {
              Write-Output "::error::makensis.exe not at $nsis after choco install — the package layout moved"; exit 1 }
            Add-Content -Path $env:GITHUB_PATH -Value $nsis
            $env:PATH = "$nsis;$env:PATH"
          }
          makensis /VERSION
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::makensis will not run"; exit 1 }

      - name: Package (installer — NSIS setup .exe, runtime+tools payload)
        run: cd build; cpack -G NSIS -C Release

      - name: "Installer gate: silent-install the .exe, run, stream, assert dev files absent, uninstall"
        shell: pwsh
        run: |
          $exe = Get-ChildItem build/naudio-*.exe | Select-Object -First 1
          if (-not $exe) { Write-Output "::error::no NSIS installer produced"; exit 1 }
          Write-Output "installer: $($exe.Name)"

          # Positive control FIRST (L222): the dev-absence assertions below can
          # only fire if the full tree really carries those paths — the ZIP
          # tree the package gate expanded does.
          $zipTree = Get-ChildItem "${{ runner.temp }}/pkgroot" | Select-Object -First 1
          foreach ($present in 'include/naudio.h','lib/naudio.lib') {
            if (-not (Test-Path "$($zipTree.FullName)/$present")) {
              Write-Output "::error::control broken: ZIP tree lacks $present — absence checks prove nothing"; exit 1 } }

          # Control for the logon-task assertions below (L222): the task must be
          # ABSENT before the install, or finding it afterwards says nothing about
          # who registered it.
          $TaskPath = '\naudio\'
          $TaskName = 'naudio-daemon'
          if (Get-ScheduledTask -TaskPath $TaskPath -TaskName $TaskName -ErrorAction SilentlyContinue) {
            Write-Output "::error::control broken: the logon task existed before the install"; exit 1 }

          $proc = Start-Process -PassThru -Wait -FilePath $exe.FullName -ArgumentList '/S'
          if ($proc.ExitCode -ne 0) { Write-Output "::error::silent install exited $($proc.ExitCode)"; exit 1 }
          $I = "$env:ProgramFiles\naudio"

          # The shipped binaries and the uninstaller are in place; the tools run
          # from the installed tree (naudio.dll beside them in bin/).
          foreach ($f in 'bin/na_audio_daemon.exe','bin/na_wav_tap.exe','bin/na_audio_source.exe','bin/na_c_play_to_speakers.exe','bin/naudio.dll','Uninstall.exe') {
            if (-not (Test-Path "$I/$f")) { Write-Output "::error::installed tree is missing $f"; exit 1 } }
          & "$I/bin/na_wav_tap.exe" --help
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::installed na_wav_tap.exe will not run"; exit 1 }

          # The daemon, on the installed layout, doing the one thing it can do here without a
          # sound card: refuse a bad config file by name and line. --help alone would prove only
          # that the image loads, and the config reader is the surface item 1 added and item 4
          # will write to, so it is the half worth asserting on a shipped binary.
          Set-Content -Path "$env:TEMP/bad.conf" -Value "junkkey = 1"
          & "$I/bin/na_audio_daemon.exe" --config "$env:TEMP/bad.conf" --mode zzz 2>&1 |
            Tee-Object -FilePath inst-daemon.log
          if ($LASTEXITCODE -ne 2) {
            Write-Output "::error::installed daemon exited $LASTEXITCODE on a bad config; expected 2"; exit 1 }
          if (-not (Select-String -Path inst-daemon.log -Pattern "bad.conf:1: unknown key 'junkkey'" -Quiet)) {
            Write-Output "::error::installed daemon did not name file:line for a bad config key"
            Get-Content inst-daemon.log
            exit 1 }
          # Control: the same binary, the same guard, a VALID config -- it must get past the
          # config reader and fail on the guard instead. Without this, a daemon that refused
          # every invocation would satisfy the assertion above.
          Set-Content -Path "$env:TEMP/ok.conf" -Value "port = 4533"
          & "$I/bin/na_audio_daemon.exe" --config "$env:TEMP/ok.conf" --mode zzz 2>&1 |
            Tee-Object -FilePath inst-daemon-ok.log
          if (-not (Select-String -Path inst-daemon-ok.log -Pattern "invalid --mode" -Quiet)) {
            Write-Output "::error::control failed: a VALID config did not reach the mode guard"
            Get-Content inst-daemon-ok.log
            exit 1 }
          Write-Output "installed daemon reads its config file and refuses a bad one by file:line"

          # Runtime proof on the INSTALLED layout: test-tone server -> null
          # client, byte-tell asserted — same discipline as the ZIP gate.
          $srv = Start-Process -PassThru -NoNewWindow -FilePath "$I/bin/na_audio_source.exe" `
                 -ArgumentList '--test-tone','--seconds','25'
          Start-Sleep -Seconds 3
          & "$I/bin/na_c_play_to_speakers.exe" --backend null --seconds 5 2>&1 |
            Tee-Object -FilePath inst-demo.log
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::installed demo client exited $LASTEXITCODE"; exit 1 }
          if (-not (Select-String -Path inst-demo.log -Pattern 'first_frame_hex=68c569c66ac76bc8' -Quiet)) {
            Write-Output "::error::byte-tell missing — the installed pair did not stream"; exit 1 }
          Stop-Process -Id $srv.Id -ErrorAction SilentlyContinue

          # --- Service registration (#96 item 2, Windows half) ----------------
          # The installer's NSIS section renders the task XML against the chosen
          # $INSTDIR and hands it to schtasks. Everything below is read back from
          # the SCHEDULER, not from the file we wrote: the file being right and
          # the task being registered are different claims.
          $task = Get-ScheduledTask -TaskPath $TaskPath -TaskName $TaskName -ErrorAction SilentlyContinue
          if (-not $task) {
            Write-Output "::error::the installer did not register the logon task"
            & schtasks.exe /Query /TN "$TaskPath$TaskName" 2>&1 | Write-Output
            exit 1 }

          # Installing must not start capturing at the next logon. This is the
          # Windows spelling of the launchd Disabled key and systemd's
          # not-enabled state, and it is asserted AS POLICY.
          if ($task.State -ne 'Disabled') {
            Write-Output "::error::the registered task is '$($task.State)', not Disabled — logging in would start capturing"; exit 1 }

          # The three defaults that would break a long-running audio service
          # SILENTLY. Read from the registered task, so a template that had them
          # and an installer that dropped them are distinguishable.
          if ($task.Settings.ExecutionTimeLimit -ne 'PT0S') {
            Write-Output "::error::ExecutionTimeLimit is '$($task.Settings.ExecutionTimeLimit)', not PT0S — the task would be killed after three days"; exit 1 }
          if ($task.Settings.DisallowStartIfOnBatteries) {
            Write-Output "::error::DisallowStartIfOnBatteries is set — the task would refuse to start on a laptop"; exit 1 }
          if ($task.Settings.StopIfGoingOnBatteries) {
            Write-Output "::error::StopIfGoingOnBatteries is set — unplugging would stop the stream"; exit 1 }
          if (-not ($task.Triggers | Where-Object { $_.CimClass.CimClassName -eq 'MSFT_TaskLogonTrigger' })) {
            Write-Output "::error::the task has no logon trigger — it would never start by itself"; exit 1 }

          # It must name a binary THIS install actually placed — the failure a
          # build-tree test structurally cannot see, and the one the operator's
          # choice of install directory is most likely to cause.
          $action = $task.Actions[0]
          if (-not (Test-Path -LiteralPath $action.Execute)) {
            Write-Output "::error::the task runs '$($action.Execute)', which the install did not create"; exit 1 }
          if ($action.Execute -ne "$I\bin\na_audio_daemon.exe") {
            Write-Output "::error::the task runs '$($action.Execute)', expected $I\bin\na_audio_daemon.exe"; exit 1 }
          if ($action.Arguments -notmatch '--mode\s+control') {
            Write-Output "::error::the task does not run --mode control: '$($action.Arguments)'"; exit 1 }

          # BEHAVIOUR: the task's OWN argument list, handed to the installed
          # binary. This is the check that catches a typo'd option — the task
          # would register perfectly and fail only at the operator's next logon.
          $taskArgs = $action.Arguments.Split(' ') + @('--mode','zzz','--no-config')
          & $action.Execute @taskArgs 2>&1 | Tee-Object -FilePath task-args.log
          if ($LASTEXITCODE -ne 2 -or -not (Select-String -Path task-args.log -Pattern "invalid --mode 'zzz'" -Quiet)) {
            Write-Output "::error::the task's own arguments did not parse (exit $LASTEXITCODE)"
            Get-Content task-args.log; exit 1 }
          Write-Output "logon task registered, disabled, no time limit, battery-safe, running $($action.Execute)"

          # --- The control page (#96 item 4) ----------------------------------
          # The Start-menu shortcut is the thing #96's acceptance actually names.
          # Both shell contexts are searched because a silent elevated install
          # writes the all-users menu and a per-user one does not.
          $lnk = @("$env:ProgramData\Microsoft\Windows\Start Menu\Programs\naudio\naudio Control.lnk",
                   "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\naudio\naudio Control.lnk") |
                 Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $lnk) {
            Write-Output "::error::no 'naudio Control' Start-menu shortcut was created"
            Get-ChildItem "$env:ProgramData\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter *.lnk |
              ForEach-Object { Write-Output "  found: $($_.FullName)" }
            exit 1 }
          $sc = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk)
          if ($sc.TargetPath -ne "$I\bin\na_audio_daemon.exe") {
            Write-Output "::error::the shortcut points at '$($sc.TargetPath)'"; exit 1 }
          if ($sc.Arguments -notmatch '--mode control' -or $sc.Arguments -notmatch '--open-page') {
            Write-Output "::error::the shortcut does not open the control page: '$($sc.Arguments)'"; exit 1 }
          Write-Output "Start-menu shortcut opens the control page: $lnk"

          # ...and the page really is served by the INSTALLED binary. Hardware-free:
          # control mode opens no device until asked, and nothing here asks.
          $ctlLog = "$env:TEMP\naudio-control.log"
          $ctl = Start-Process -PassThru -NoNewWindow -FilePath "$I\bin\na_audio_daemon.exe" `
                 -ArgumentList '--mode','control','--control-port','0','--autostart','false',
                               '--no-config','--duration-ms','25000' `
                 -RedirectStandardOutput $ctlLog
          $url = $null
          foreach ($i in 1..60) {
            if (Test-Path $ctlLog) {
              $line = Select-String -Path $ctlLog -Pattern '^control page : (\S+)' | Select-Object -First 1
              if ($line) { $url = $line.Matches[0].Groups[1].Value; break }
            }
            Start-Sleep -Milliseconds 250
          }
          if (-not $url) {
            Write-Output "::error::the installed daemon served no control page"
            if (Test-Path $ctlLog) { Get-Content $ctlLog }; exit 1 }
          $page = (Invoke-WebRequest -UseBasicParsing -Uri $url).Content
          if ($page -notmatch 'naudio control') {
            Write-Output "::error::the installed daemon's page is not the control page"; exit 1 }
          $state = (Invoke-WebRequest -UseBasicParsing -Uri "${url}api/state").Content
          if ($state -notmatch '"state":"idle"') {
            Write-Output "::error::/api/state did not report an idle pipeline: $state"; exit 1 }
          # Control: a port with nothing on it must NOT answer, or the two
          # assertions above would pass on any machine that has a web server.
          $dead = $false
          try { Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:1/' -TimeoutSec 3 | Out-Null }
          catch { $dead = $true }
          if (-not $dead) { Write-Output "::error::control broken: a dead port answered"; exit 1 }
          Stop-Process -Id $ctl.Id -ErrorAction SilentlyContinue
          Write-Output "installed daemon serves its control page and reports an idle pipeline"

          # Payload policy is runtime+tools ONLY.
          foreach ($absent in 'include','lib/naudio.lib','lib/cmake') {
            if (Test-Path "$I/$absent") {
              Write-Output "::error::installer shipped dev path $absent — payload must be runtime+tools only"; exit 1 } }

          # And the uninstaller actually removes what was installed. _?= makes
          # the NSIS uninstaller run synchronously in place (it then cannot
          # delete its own .exe — only the payload is asserted gone).
          # The _?= path contains a space; Start-Process joins -ArgumentList
          # with spaces and no quoting, so the quotes ride inside the string.
          $un = Start-Process -PassThru -Wait -FilePath "$I/Uninstall.exe" -ArgumentList '/S',"`"_?=$I`""
          if ($un.ExitCode -ne 0) { Write-Output "::error::silent uninstall exited $($un.ExitCode)"; exit 1 }
          foreach ($gone in 'bin/na_wav_tap.exe','bin/na_audio_daemon.exe') {
            if (Test-Path "$I/$gone") { Write-Output "::error::uninstaller left $gone behind"; exit 1 } }
          # ...including the logon task. This is also what would catch the
          # uninstall section running AFTER the payload (and therefore the
          # registration script) had already been deleted.
          if (Get-ScheduledTask -TaskPath $TaskPath -TaskName $TaskName -ErrorAction SilentlyContinue) {
            Write-Output "::error::the uninstaller left the logon task registered"; exit 1 }
          Write-Output "the uninstaller removed the logon task as well as the payload"
          Write-Output "== Windows installer gate: PASS =="

      - uses: actions/upload-artifact@v4
        with:
          name: package-windows
          path: |
            build/naudio-*.zip
            build/naudio-*.exe
          if-no-files-found: error

  release:
    name: attach artifacts to the GitHub Release
    runs-on: ubuntu-latest
    needs: [package-macos, package-linux, package-windows]
    # Tag pushes only — a workflow_dispatch run is the dry run and stops at the
    # uploaded workflow artifacts above.
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum naudio-* > sha256sums.txt && cat sha256sums.txt

      - name: Create (or complete) the Release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # An rc tag publishes a PRERELEASE — visible as such on the Releases
          # page, and excluded from "latest release" until the final tag lands.
          pre=""
          case "$tag" in *rc[0-9]*) pre="--prerelease" ;; esac
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --verify-tag $pre --title "naudio $tag" \
              --notes "Binary packages for $tag. See CHANGELOG.md for what changed. Want it to just work? Take the .pkg (macOS) or the setup .exe (Windows) — double-click installers carrying the runtime library and tools, no build files; on Linux the .deb/.rpm are the equivalent. Both installers are unsigned: macOS needs right-click -> Open the first time, Windows shows a SmartScreen warning (More info -> Run anyway). Developers: the tarballs/ZIP carry headers, pkg-config and the CMake package; DEB/RPM install under /usr, tarballs are relocatable (tools find libnaudio via a relative rpath). The Hamlib bridge (na_hamlib_bridge) is not included: it needs a streaming-capable libhamlib no released Hamlib provides yet, and it will join the packages — linked against the system's real libhamlib — once one does. Until then it builds from source: docs/hamlib-streaming-bridge.md."
          fi
          gh release upload "$tag" dist/naudio-* dist/sha256sums.txt --clobber
          gh release view "$tag" --json assets --jq '.assets[].name'
