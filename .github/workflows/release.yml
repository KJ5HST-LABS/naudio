name: Release

# Build, gate and publish binary packages (issue #93).
#
# Two triggers, one pipeline:
#   * push of a v* tag  — the release: every platform builds, the full suite runs,
#     the PACKAGES themselves are gated (not the build tree they came from), and
#     the artifacts land on a GitHub Release for that tag.
#   * workflow_dispatch — the DRY RUN: byte-identical jobs, artifacts land as
#     workflow artifacts only and no Release is touched. This is what makes the
#     pipeline provable without cutting a release — the tag path differs only in
#     the final attach job.
#
# Release shape (differs from ci.yml's development shape, deliberately):
#   * NAUDIO_BUNDLE_PORTAUDIO=ON — the FetchContent static PortAudio is linked
#     INTO libnaudio, so the package cannot silently grow a dependency on a
#     Homebrew/apt dylib just because the runner image has one (the same
#     determinism reasoning as the option's own comment in CMakeLists.txt).
#   * na_hamlib_bridge is deliberately NOT packaged, and no hamlib is embedded
#     or referenced: no released Hamlib provides the streaming API the bridge
#     needs, and shipping a frozen pre-release hamlib inside the binary would
#     put a second hamlib dialect beside applications that carry their own
#     (WSJT-class apps bundle one). The bridge stays fully built and tested
#     from source (ci.yml's bridge job); it returns to the packages linked
#     against the REAL released libhamlib the day one ships the streaming API
#     — tracked in the repo issue opened for exactly that event.
#   * Every self-containment claim is asserted on the ARTIFACT with ldd/otool,
#     never inferred from the configuration — a green build with the wrong
#     flags would otherwise ship the wrong package (Learning 9's shape).
#
# The per-platform package gates below are the issue's acceptance criterion:
# a PACKAGE-BASED install (unpacked tarball, dpkg -i, expanded zip) passes the
# same external-consumer commands ci.yml runs against a build-tree install.
#
# Double-clickable installers (operator-directed, S141): macOS ships a
# productbuild .pkg and Windows an NSIS setup .exe alongside the archives.
# Their payload is runtime+tools ONLY — no headers, no .pc, no CMake package
# (scoped at cpack time in cmake/CPackProjectConfig.cmake); the gates assert
# that absence as policy, with the archive trees as the positive control that
# the absence checks can fire. DEB/RPM already are Linux's double-clickable
# installers and are unchanged.
#
# SIGNING IS MEASURED, NEVER ASSERTED (issue #99). Since 2026-09-02 this workflow signs and
# notarizes the macOS .pkg itself: package-macos imports both Developer ID certificates into
# a throwaway keychain, CPACK_PRE_BUILD_SCRIPTS signs every payload binary (hardened runtime,
# secure timestamp, the audio-input entitlement on the two capture tools), and once the
# installer gate has passed, the wrapper is productsign'd, submitted to Apple's notary, and
# the ticket stapled. None of that is TRUSTED: package-macos then runs
# packaging/macos/signing-status.sh against the artifact and the release job writes the macOS
# sentence from that measurement, so a run whose secrets were missing publishes an honest
# "unsigned" note rather than a false "signed" one. The note used to assert "signed and
# notarized and opens with no warning" unconditionally, which was false at the moment it
# published and true only if a human followed up; an earlier wording asserted the opposite and
# sent users through a Gatekeeper bypass they did not need. Both were the same defect — a
# signing outcome nothing established. packaging/macos/publish-signed-pkg.sh remains as the
# fallback for a release that was published without the secrets; it rewrites the same
# sentence from the same measurement. The Windows installer is unsigned and SmartScreen
# warns about it.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version-guard:
    name: tag matches PROJECT_VERSION
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare the pushed tag against project(naudio VERSION)
        run: |
          proj="$(sed -n 's/^ *VERSION \([0-9][0-9.]*\)$/\1/p' CMakeLists.txt | head -1)"
          echo "PROJECT_VERSION=${proj}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # Package files are named from PROJECT_VERSION, the Release from the
            # tag. If they disagree, v0.5.1 would publish artifacts named 0.5.0 —
            # caught here, before three platforms build them. A release
            # candidate is the numeric version plus an rcN suffix (project
            # VERSION is numeric-only by CMake's grammar, so the rc lives on
            # the tag and flows into the artifact names via
            # NAUDIO_PKG_VERSION_SUFFIX in each package job).
            case "${GITHUB_REF_NAME}" in
              "v${proj}")
                echo "tag ${GITHUB_REF_NAME} matches" ;;
              "v${proj}"rc[0-9] | "v${proj}"rc[0-9][0-9])
                echo "tag ${GITHUB_REF_NAME} matches (release candidate of ${proj})" ;;
              *)
                echo "::error::tag ${GITHUB_REF_NAME} != v${proj}[rcN] (CMakeLists.txt project VERSION)"; exit 1 ;;
            esac
          else
            echo "dispatch dry run — no tag to compare"
          fi

  package-macos:
    name: package (macos, TGZ + installer .pkg)
    runs-on: macos-latest
    needs: version-guard
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the suite's version-skew arm pins old headers out of history (ci.yml:66)

      - name: Derive the pre-release suffix from the tag (empty on final tags and dry runs)
        run: echo "NAUDIO_PKG_SUFFIX=$(echo "${GITHUB_REF_NAME}" | sed -n 's/^v[0-9.]*\(rc[0-9][0-9]*\)$/\1/p')" >> "$GITHUB_ENV"

      - name: Import the Developer ID certificates (throwaway keychain)
        env:
          APP_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          APP_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          INSTALLER_P12: ${{ secrets.DEVELOPER_ID_INSTALLER_P12 }}
          INSTALLER_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_INSTALLER_PASSWORD }}
        run: |
          set -euo pipefail
          # No secret -> build unsigned, loudly. Degrading silently is the one thing this
          # must not do: the signing-status step measures the artifact either way, so the
          # release note stays honest, but a human reading the log must see which happened.
          if [ -z "${APP_P12:-}" ]; then
            echo "::warning::DEVELOPER_ID_CERTIFICATE_P12 is empty — the payload will NOT be signed"
            exit 0
          fi
          kc="$RUNNER_TEMP/naudio-signing.keychain-db"
          pw=$(uuidgen)
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          printf '%s' "$APP_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$APP_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          # The Installer identity signs the .pkg WRAPPER (productsign); the Application one
          # above signs the Mach-Os inside it. The notary wants both.
          if [ -n "${INSTALLER_P12:-}" ]; then
            printf '%s' "$INSTALLER_P12" | base64 --decode > "$RUNNER_TEMP/installer.p12"
            security import "$RUNNER_TEMP/installer.p12" -k "$kc" -P "$INSTALLER_P12_PASSWORD" -T /usr/bin/productsign
            rm -f "$RUNNER_TEMP/installer.p12"
          else
            echo "::warning::DEVELOPER_ID_INSTALLER_P12 is empty — the .pkg wrapper will NOT be signed"
          fi
          # Without this, codesign blocks on a keychain-access prompt a runner has no UI to
          # answer — the job burns its timeout instead of failing, which is strictly worse.
          # Once, after BOTH imports: it applies to the keys present at that moment.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          # PROVE an identity landed rather than trusting `security import`'s exit code: a
          # wrong password or a non-base64 secret can leave an empty keychain behind a 0.
          id=$(security find-identity -v -p codesigning "$kc" \
               | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)
          [ -n "$id" ] || { echo "::error::no Developer ID Application identity after import"; exit 1; }
          echo "NAUDIO_KEYCHAIN=$kc" >> "$GITHUB_ENV"
          echo "NAUDIO_CODESIGN_IDENTITY=$id" >> "$GITHUB_ENV"
          echo "imported: $id"
          if [ -n "${INSTALLER_P12:-}" ]; then
            # No `-p codesigning` here: an Installer certificate is not a code-signing
            # identity and that policy filter hides it (measured: 0 with it, 1 without).
            inst=$(security find-identity -v "$kc" \
                   | sed -n 's/.*"\(Developer ID Installer: [^"]*\)".*/\1/p' | head -1)
            [ -n "$inst" ] || { echo "::error::no Developer ID Installer identity after import"; exit 1; }
            echo "NAUDIO_PRODUCTSIGN_IDENTITY=$inst" >> "$GITHUB_ENV"
            echo "imported: $inst"
          fi

      - name: Configure (release shape — no bridge, no hamlib; PortAudio bundled)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
                -DNAUDIO_BUNDLE_PORTAUDIO=ON \
                -DCMAKE_INSTALL_PREFIX=/usr/local \
                -DNAUDIO_CODESIGN_IDENTITY="${{ env.NAUDIO_CODESIGN_IDENTITY }}" \
                -DNAUDIO_PKG_VERSION_SUFFIX="${{ env.NAUDIO_PKG_SUFFIX }}"

      - name: Build
        run: cmake --build build -j

      - name: Assert the four shipped binaries were built — never the build's exit code
        run: |
          for t in tools/na_audio_daemon tools/na_wav_tap \
                   examples/na_audio_source examples/na_c_play_to_speakers; do
            test -x "build/$t" || { echo "::error::$t was not built"; exit 1; }
          done

      - name: Test (full suite)
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: cd build && cpack -G TGZ

      - name: "Package gate: unpack, consume, run, scan"
        run: |
          set -euo pipefail
          pkg=$(ls build/naudio-*.tar.gz)
          echo "package: $pkg"
          mkdir -p "${{ runner.temp }}/pkg"
          tar xzf "$pkg" -C "${{ runner.temp }}/pkg" --strip-components 1
          P="${{ runner.temp }}/pkg"

          # Tools run from the unpacked tree with NO library-path environment —
          # this is the relative-rpath contract the package relies on.
          "$P/bin/na_wav_tap" --help > /dev/null
          "$P/bin/na_audio_daemon" -h > /dev/null 2>&1
          "$P/bin/na_audio_source" --help > /dev/null
          "$P/bin/na_c_play_to_speakers" --help > /dev/null
          echo "all four shipped binaries run env-free from the package"

          # The daemon's second copy (#105): the control app's executable. It is the same
          # bytes as bin/'s only until signing: signed as the bundle's executable, its code
          # directory binds the bundle's Info.plist, so outside a bundle the signature is
          # invalid ("invalid Info.plist", codesign --verify) and the hardened runtime has
          # the kernel kill it at exec — SIGKILL, exit 137 — and the notary rejects it as
          # a loose file for the same reason. Measured 2026-09-16 on rc9's first cut: this
          # gate's first run ran the loose copy bare and died exactly so, and the notary
          # refused the .pkg over the same file. So a SIGNED payload carries the sealed
          # bundle whole, as share/naudio/app.zip (cmake/CodesignPayload.cmake), and no
          # loose executable; an UNSIGNED one carries the pieces the postinstall assembles.
          # Either way the executable is tested as what it is — inside its bundle: it must
          # run there and (when signed) verify. Two signed controls: the loose copy must be
          # ABSENT (its presence is what the notary rejects), and a copy taken out of the
          # extracted bundle and run bare must be killed — proof the executable is the
          # bundle-signed one and not a duplicate of bin/'s. Unsigned, the bare run
          # succeeds and proves nothing, which is said rather than counted.
          APPX="${{ runner.temp }}/tgz-app"; rm -rf "$APPX"; mkdir -p "$APPX"
          app_name=$(plutil -extract CFBundleName raw -o - "$P/share/naudio/naudio-control.Info.plist")
          APPB="$APPX/$app_name.app"
          if [ -f "$P/share/naudio/app.zip" ]; then
            ditto -x -k "$P/share/naudio/app.zip" "$APPX"
            test -d "$APPB" || { echo "::error::app.zip did not extract to '$app_name.app' (found: $(ls "$APPX"))"; exit 1; }
            how="extracted from app.zip"
          else
            mkdir -p "$APPB/Contents/MacOS" "$APPB/Contents/Resources"
            cp "$P/share/naudio/na_audio_daemon" "$APPB/Contents/MacOS/"
            cp "$P/share/naudio/naudio-control.Info.plist" "$APPB/Contents/Info.plist"
            cp "$P/share/naudio/naudio.icns" "$APPB/Contents/Resources/"
            how="assembled from the pieces"
          fi
          "$APPB/Contents/MacOS/na_audio_daemon" -h > /dev/null 2>&1 \
            || { echo "::error::the app's executable does not run from inside the bundle $how"; exit 1; }
          if [ -n "${NAUDIO_CODESIGN_IDENTITY:-}" ]; then
            test -f "$P/share/naudio/app.zip" \
              || { echo "::error::the payload is signed but carries no share/naudio/app.zip — the sealed bundle did not ship"; exit 1; }
            test ! -e "$P/share/naudio/na_audio_daemon" \
              || { echo "::error::the signed payload still carries the loose share/naudio/na_audio_daemon — the notary rejects it as an invalid signature"; exit 1; }
            codesign --verify --deep --strict "$APPB" \
              || { echo "::error::the bundle $how does not verify"; exit 1; }
            cp "$APPB/Contents/MacOS/na_audio_daemon" "$APPX/bare_copy"
            set +e; "$APPX/bare_copy" -h > /dev/null 2>&1; bare_rc=$?; set -e
            [ "$bare_rc" -eq 137 ] \
              || { echo "::error::the bundle's executable ran BARE (exit $bare_rc) — it is not the bundle-signed copy"; exit 1; }
            echo "app executable: $how, runs inside the bundle, verifies, no loose copy shipped, and a copy taken out is killed (137) as a bundle-bound signature must be"
          else
            echo "app executable: $how, runs inside the bundle (unsigned build; the signed controls do not apply)"
          fi

          # Self-containment: every load command outside @rpath//usr/lib//System
          # is a finding. Cardinality-checked (L230): exactly 6 binaries scanned
          # (2 tools, the daemon again as the app's executable — read from the
          # bundle above, wherever the payload carried it — the demo pair,
          # libnaudio). A bin/na_hamlib_bridge here would trip the count — the
          # bridge is deliberately not packaged.
          scanned=0
          for f in "$P"/bin/* "$APPB/Contents/MacOS/na_audio_daemon" "$P"/lib/libnaudio.*.*.*.dylib; do
            scanned=$((scanned+1))
            bad=$(otool -L "$f" | tail -n +2 | grep -v '@rpath\|/usr/lib/\|/System/' || true)
            if [ -n "$bad" ]; then echo "::error::$f references non-system libraries:"; echo "$bad"; exit 1; fi
          done
          [ "$scanned" -eq 6 ] || { echo "::error::expected to scan 6 binaries, scanned $scanned"; exit 1; }
          echo "otool scan clean over $scanned binaries"

          # The external-consumer gate, against the PACKAGE (find_package path).
          cmake -S tests/external-consumer -B consumer-build -DCMAKE_PREFIX_PATH="$P" > consumer.log 2>&1 \
            || { cat consumer.log; echo "::error::find_package(naudio) failed against the package"; exit 1; }
          grep -E 'external-consumer: naudio_pa arm (ENABLED|SKIPPED)' consumer.log
          cmake --build consumer-build -j > /dev/null
          DYLD_LIBRARY_PATH="$P/lib" ./consumer-build/consume_c   | tee -a consume.log
          DYLD_LIBRARY_PATH="$P/lib" ./consumer-build/consume_cxx | tee -a consume.log
          grep -q '^consume_c OK'   consume.log || { echo "::error::consume_c did not run"; exit 1; }
          grep -q '^consume_cxx OK' consume.log || { echo "::error::consume_cxx did not run"; exit 1; }

          # And the pkg-config path, relocated to wherever the tarball landed.
          cflags=$(PKG_CONFIG_PATH="$P/lib/pkgconfig" pkg-config --define-prefix --cflags naudio)
          libs=$(PKG_CONFIG_PATH="$P/lib/pkgconfig" pkg-config --define-prefix --libs naudio)
          cc $cflags tests/external-consumer/consume_c.c $libs -o consume_c_pc
          DYLD_LIBRARY_PATH="$P/lib" ./consume_c_pc | grep -q '^consume_c OK' \
            || { echo "::error::pkg-config consumer did not run"; exit 1; }
          echo "== macOS package gate: PASS =="

      - name: Package (installer — productbuild .pkg, runtime+tools payload)
        run: cd build && cpack -G productbuild

      - name: "Installer gate: install the .pkg for real, run, scan, assert dev files absent"
        run: |
          set -euo pipefail
          pkg=$(ls build/naudio-*.pkg)
          echo "installer: $pkg"

          # What the Installer window calls the product — its <title>, which is the
          # "Install …" in the title bar and the "Welcome to the … Installer" line — is
          # the service's name, read off the built package's Distribution rather than
          # off the CMake variable that was meant to set it. rc9's read "Install naudio"
          # (operator, 2026-09-16). The welcome and read-me panes must be ours too:
          # without a welcome file macOS shows its own sentence.
          rm -rf "${{ runner.temp }}/pkg-x"
          pkgutil --expand "$pkg" "${{ runner.temp }}/pkg-x"
          dist_title=$(sed -n 's|.*<title>\(.*\)</title>.*|\1|p' "${{ runner.temp }}/pkg-x/Distribution")
          [ "$dist_title" = "Network Audio Service" ] \
            || { echo "::error::the Installer's title is '$dist_title', not the service's name"; exit 1; }
          for pane in Welcome.txt ReadMe.txt; do
            test -s "${{ runner.temp }}/pkg-x/Resources/$pane" \
              || { echo "::error::the .pkg carries no $pane pane"; exit 1; }
            grep -q 'Network Audio Service' "${{ runner.temp }}/pkg-x/Resources/$pane" \
              || { echo "::error::the $pane pane does not name the service"; exit 1; }
          done
          echo "installer title: $dist_title; welcome and read-me panes name the service"

          # Positive control FIRST (L222): the dev-absence assertions below can
          # only mean something if the same paths exist in the full tree — the
          # TGZ tree gate 1 unpacked carries them.
          for present in include/naudio.h lib/pkgconfig/naudio.pc lib/libnaudio.dylib; do
            test -e "${{ runner.temp }}/pkg/$present" \
              || { echo "::error::control broken: TGZ tree lacks $present — absence checks prove nothing"; exit 1; }
          done

          # Control for the service-registration assertions below (L222): the
          # agent must be absent BEFORE the install, or its presence afterwards
          # proves nothing about who put it there.
          AGENT=/Library/LaunchAgents/org.kj5hst.naudio.daemon.plist
          test ! -e "$AGENT" \
            || { echo "::error::control broken: $AGENT existed before the install"; exit 1; }
          # Same control for the Applications shortcut (#96 item 4).
          APP="/Applications/Network Audio Service.app"
          test ! -e "$APP" \
            || { echo "::error::control broken: $APP existed before the install"; exit 1; }
          # The bundle rc7 and rc8 placed under the page's name carries the same
          # identifier; the postinstall must remove it on upgrade, or LaunchServices
          # — and so Login Items — may resolve the identifier to either (#102).
          # Planted here so its absence after the install is a measurement.
          APP_LEGACY="/Applications/naudio Control.app"
          sudo mkdir -p "$APP_LEGACY/Contents"

          # THE install the deliverable promises: Installer.app's command-line
          # twin placing real files under /usr/local, receipt and all.
          sudo installer -pkg "$pkg" -target /
          pkgutil --pkgs | grep -c '^org\.kj5hst\.naudio\.' | grep -qx 2 \
            || { echo "::error::expected exactly the runtime+tools receipts"; pkgutil --pkgs | grep naudio; exit 1; }

          # The four binaries run from /usr/local/bin with no environment, and
          # the man pages landed beside them.
          /usr/local/bin/na_wav_tap --help > /dev/null
          /usr/local/bin/na_audio_daemon -h > /dev/null 2>&1
          /usr/local/bin/na_audio_source --help > /dev/null
          /usr/local/bin/na_c_play_to_speakers --help > /dev/null
          test -f /usr/local/share/man/man1/na_audio_daemon.1

          # otool self-containment on the INSTALLED files, cardinality 6 (L230): the
          # daemon in bin/ and again as the control app's executable (#105).
          scanned=0
          for f in /usr/local/bin/na_wav_tap /usr/local/bin/na_audio_daemon \
                   /usr/local/bin/na_audio_source /usr/local/bin/na_c_play_to_speakers \
                   "$APP/Contents/MacOS/na_audio_daemon" \
                   /usr/local/lib/libnaudio.*.*.*.dylib; do
            scanned=$((scanned+1))
            bad=$(otool -L "$f" | tail -n +2 | grep -v '@rpath\|/usr/lib/\|/System/' || true)
            if [ -n "$bad" ]; then echo "::error::$f references non-system libraries:"; echo "$bad"; exit 1; fi
          done
          [ "$scanned" -eq 6 ] || { echo "::error::expected to scan 6 installed binaries, scanned $scanned"; exit 1; }

          # Payload policy is runtime+tools ONLY — the absence half of the
          # control proven fireable above.
          for absent in /usr/local/include/naudio.h /usr/local/lib/pkgconfig/naudio.pc \
                        /usr/local/lib/cmake/naudio /usr/local/lib/libnaudio.dylib; do
            if [ -e "$absent" ]; then
              echo "::error::installer shipped dev file $absent — payload must be runtime+tools only"; exit 1; fi
          done

          # --- Service registration (#96 item 2): the postinstall ran ---------
          test -f "$AGENT" \
            || { echo "::error::the .pkg postinstall did not register the launchd agent"; exit 1; }
          plutil -lint "$AGENT" > /dev/null \
            || { echo "::error::the registered agent is not a valid plist"; exit 1; }

          # The agent must name a binary that this install actually placed. A
          # unit pointing at a path the package does not create is the whole
          # failure mode, and only the INSTALLED layout can answer it.
          exec_path=$(plutil -extract ProgramArguments.0 raw -o - "$AGENT")
          test -x "$exec_path" \
            || { echo "::error::agent names '$exec_path', which the install did not create"; exit 1; }
          # And that binary must be the control app's own executable (#105): macOS
          # names a process in the Microphone prompt and in Privacy & Security after
          # its bundle and after nothing else, so an agent run from bin/ is
          # "na_audio_daemon" with a generic icon and one run from here is the
          # service. A relation between the registered agent and the installed
          # bundle's Info.plist, not a literal path.
          app_exec_name=$(plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist" 2>/dev/null || true)
          [ -n "$app_exec_name" ] && [ "$exec_path" = "$APP/Contents/MacOS/$app_exec_name" ] \
            || { echo "::error::agent runs '$exec_path', not the control app's executable '$APP/Contents/MacOS/$app_exec_name' — the Microphone prompt would name a file, not the service"; exit 1; }

          # The agent must NOT carry a Disabled key (#102). Until rc8 it did,
          # and Login Items then showed a switch that was ON while launchd had
          # never bootstrapped the job — the switch and launchctl's override
          # are independent stores (measured 2026-09-13), so the one switch is
          # the platform's and the plist must not fight it. Asserted AS POLICY,
          # like the dev-file absence above; the "must not capture at the next
          # login" half is now a BEHAVIOUR of the registered arguments, asserted
          # on the installed binary below.
          if plutil -extract Disabled raw -o - "$AGENT" > /dev/null 2>&1; then
            echo "::error::the registered agent carries a Disabled key — Login Items would show a switch that does nothing"; exit 1; fi

          # It did not start one NOW either. An assertion of absence is
          # worth nothing from an instrument that finds nothing, so pgrep gets a
          # control built from the EXACT name searched for: a symlink to sleep,
          # run, observed, killed, and observed gone. Borrowing a system process
          # as the sentinel does NOT work — pgrep never matches PID 1, so
          # `pgrep -x launchd` fails on every Mac (measured). Nor does copying a
          # binary: an unsigned copy is killed on arm64.
          ctl_dir=$(mktemp -d)
          ln -s /bin/sleep "$ctl_dir/na_audio_daemon"
          "$ctl_dir/na_audio_daemon" 60 &
          ctl_pid=$!
          disown "$ctl_pid" 2>/dev/null || true
          seen=0
          for _ in 1 2 3 4 5; do
            if pgrep -x na_audio_daemon > /dev/null; then seen=1; break; fi
            sleep 1
          done
          [ "$seen" -eq 1 ] \
            || { echo "::error::control broken: pgrep cannot see a process named na_audio_daemon"; exit 1; }
          kill "$ctl_pid" 2>/dev/null || true
          gone=0
          for _ in 1 2 3 4 5; do
            if pgrep -x na_audio_daemon > /dev/null; then sleep 1; else gone=1; break; fi
          done
          # No `wait` here, deliberately: it would block until the stand-in ends
          # on its own, and a kill that silently failed could then never be
          # caught by the loop above — the assertion would be dead code.
          [ "$gone" -eq 1 ] \
            || { echo "::error::the control stand-in outlived its kill — the check below cannot run"; exit 1; }
          rm -rf "$ctl_dir"

          if pgrep -x na_audio_daemon > /dev/null; then
            echo "::error::the daemon is running after a bare install"; exit 1; fi

          # The agent logs to an absolute path (launchd expands neither ~ nor
          # $HOME), so the postinstall must have created that directory.
          log_dir=$(dirname "$(plutil -extract StandardErrorPath raw -o - "$AGENT")")
          test -d "$log_dir" \
            || { echo "::error::agent logs to $log_dir, which the postinstall did not create"; exit 1; }
          echo "launchd agent registered, switched by Login Items, and pointing at $exec_path"

          # --- The control page (#96 item 4) ---------------------------------
          # The agent runs the daemon in CONTROL mode now, which is what makes
          # "enable the service" give an operator a page rather than an open
          # microphone. Asserted on the registered agent, not on the template.
          [ "$(plutil -extract ProgramArguments.1 raw -o - "$AGENT")" = "--mode" ] \
            && [ "$(plutil -extract ProgramArguments.2 raw -o - "$AGENT")" = "control" ] \
            || { echo "::error::the registered agent does not run --mode control"; exit 1; }

          # The Applications entry the postinstall copies out of the payload —
          # the shortcut #96's acceptance names, since macOS has no .desktop.
          test -d "$APP" \
            || { echo "::error::the .pkg postinstall did not place $APP"; exit 1; }
          test ! -e "$APP_LEGACY" \
            || { echo "::error::the .pkg postinstall left the pre-rename bundle at $APP_LEGACY — two bundles now carry one identifier"; exit 1; }
          plutil -lint "$APP/Contents/Info.plist" > /dev/null \
            || { echo "::error::$APP has an invalid Info.plist"; exit 1; }
          # One name in Settings, the Finder and Spotlight (#102): the Finder shows
          # the ON-DISK name and ignores a differing CFBundleDisplayName; Login Items
          # shows the display name (measured 2026-09-14). All three are one string,
          # asserted as relations between the installed bundle's own fields.
          app_name=$(plutil -extract CFBundleName raw -o - "$APP/Contents/Info.plist" 2>/dev/null || true)
          app_display=$(plutil -extract CFBundleDisplayName raw -o - "$APP/Contents/Info.plist" 2>/dev/null || true)
          [ -n "$app_name" ] && [ "$(basename "$APP" .app)" = "$app_name" ] \
            || { echo "::error::$APP is not named after its CFBundleName ('$app_name') — the Finder would show a different name from Login Items"; exit 1; }
          [ "$app_display" = "$app_name" ] \
            || { echo "::error::$APP's CFBundleDisplayName ('$app_display') differs from its CFBundleName ('$app_name')"; exit 1; }
          # The bundle's executable is the daemon (#105): a bundle whose executable
          # is not executable is not opened by LaunchServices, and it says nothing
          # about why. It must run env-free from inside the bundle, like bin/'s.
          test -x "$APP/Contents/MacOS/$app_exec_name" \
            || { echo "::error::$APP's executable Contents/MacOS/$app_exec_name is missing or not executable"; exit 1; }
          "$APP/Contents/MacOS/$app_exec_name" -h > /dev/null 2>&1 \
            || { echo "::error::$APP's executable does not run"; exit 1; }
          test ! -e "$APP/Contents/MacOS/naudio-control" \
            || { echo "::error::$APP still carries the pre-#105 launcher script"; exit 1; }
          # Its icon (#103): the installed plist names a file, and the postinstall
          # placed that file under Resources — a relation between two installed
          # files, not a literal name — and it is a complete .icns (iconutil
          # unpacks it to Apple's ten members; a truncated one unpacks to none).
          app_icon=$(plutil -extract CFBundleIconFile raw -o - "$APP/Contents/Info.plist" 2>/dev/null || true)
          [ -n "$app_icon" ] \
            || { echo "::error::$APP's Info.plist has no CFBundleIconFile — the Finder, the Dock and Login Items would show the generic icon"; exit 1; }
          test -f "$APP/Contents/Resources/$app_icon" \
            || { echo "::error::$APP names its icon '$app_icon' but the postinstall did not place Contents/Resources/$app_icon"; exit 1; }
          rm -rf "$RUNNER_TEMP/icon.iconset"
          iconutil -c iconset "$APP/Contents/Resources/$app_icon" -o "$RUNNER_TEMP/icon.iconset" \
            || { echo "::error::the installed $app_icon is not an .icns iconutil can unpack"; exit 1; }
          [ "$(find "$RUNNER_TEMP/icon.iconset" -name 'icon_*.png' | wc -l | tr -d ' ')" -eq 10 ] \
            || { echo "::error::the installed $app_icon unpacks to $(ls "$RUNNER_TEMP/icon.iconset" | wc -l | tr -d ' ') iconset members, not 10"; exit 1; }
          echo "  icon: $APP/Contents/Resources/$app_icon (10 iconset members)"

          # The agent names this bundle (#102): Login Items shows the service
          # under the app's name only when AssociatedBundleIdentifiers resolves
          # to the bundle the postinstall placed. The relation the servicecheck
          # arm asserts on the generated files, here on the INSTALLED ones.
          app_id=$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist" 2>/dev/null || true)
          assoc=$(plutil -extract AssociatedBundleIdentifiers.0 raw -o - "$AGENT" 2>/dev/null || true)
          [ -n "$app_id" ] && [ "$assoc" = "$app_id" ] \
            || { echo "::error::the registered agent associates '$assoc' but $APP is '$app_id' — Login Items would name the developer"; exit 1; }
          # A signed payload must have placed the bundle's signature too: the
          # association is silently dropped for an unsigned app (measured
          # 2026-09-13). The signature itself is verified in the next step.
          if [ -n "${NAUDIO_CODESIGN_IDENTITY:-}" ]; then
            test -f "$APP/Contents/_CodeSignature/CodeResources" \
              || { echo "::error::the payload was signed but $APP has no _CodeSignature/CodeResources — the postinstall did not place the bundle's signature"; exit 1; }
          fi

          # BEHAVIOUR on the installed binary, with the REGISTERED AGENT'S OWN
          # ARGUMENTS (#102): since the plist no longer carries Disabled, "a
          # bare install captures nothing at the next login" is a property of
          # what launchd will run, so that is what runs here — the argument
          # list read back off the installed plist, not a hand-written one
          # that could agree with itself. Two additions the agent does not
          # carry: --control-port 0 (a free port) and --no-config (the runner's
          # own files stay out of it); the --duration-ms backstop is appended
          # LAST because the last occurrence wins and the agent's own 0 would
          # otherwise run until killed by nothing. Serve the page, fetch it,
          # fetch the state the browser polls. Hardware-free — control mode
          # opens no device until asked, and nothing here asks.
          agent_args=()
          n=1
          while v=$(plutil -extract "ProgramArguments.$n" raw -o - "$AGENT" 2>/dev/null); do
            agent_args+=("$v"); n=$((n+1))
          done
          [ "${#agent_args[@]}" -ge 2 ] \
            || { echo "::error::read ${#agent_args[@]} arguments off the registered agent; expected --mode control at least"; exit 1; }
          echo "registered agent runs: $exec_path ${agent_args[*]}"
          "$exec_path" "${agent_args[@]}" --control-port 0 --no-config \
                       --duration-ms 20000 > /tmp/ctl.log 2>&1 &
          ctl_daemon=$!
          url=""
          for _ in $(seq 1 50); do
            url=$(sed -n 's/^control page : //p' /tmp/ctl.log)
            [ -n "$url" ] && break
            sleep 0.2
          done
          [ -n "$url" ] || { echo "::error::the installed daemon served no control page"; cat /tmp/ctl.log; exit 1; }
          curl -fsS "$url" | grep -q 'naudio control' \
            || { echo "::error::the installed daemon's control page is not the control page"; exit 1; }
          curl -fsS "${url}api/state" | grep -q '"state":"idle"' \
            || { echo "::error::the installed daemon's /api/state did not report an idle pipeline"; exit 1; }
          # The page's "Runs at login" row (#102): the installed daemon must see
          # the agent the postinstall registered — the one host where the value
          # is known, so it is asserted here and only its shape in the arm. The
          # switch itself reads off ("enabled":false): nothing bootstrapped the
          # job into the runner's gui domain, and that is what login does.
          svc=$(curl -fsS "${url}api/state" | sed -n 's/.*"service":{\([^}]*\)}.*/\1/p')
          case "$svc" in
            *'"manager":"launchd"'*'"installed":true'*) echo "  service: $svc" ;;
            *) echo "::error::the installed daemon does not see its own launchd agent: service={$svc}"; exit 1 ;;
          esac
          # The route the row's button calls, behind the same defences as the
          # rest: a foreign Origin is refused, and the well-formed POST opens the
          # pane (a runner has a GUI session; `open` exits 0 there).
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
                -H 'Origin: http://evil.example' -d '{}' "${url}api/open-login-items")" = "403" ] \
            || { echo "::error::/api/open-login-items accepted a foreign Origin"; exit 1; }
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
                -d '{}' "${url}api/open-login-items")" = "200" ] \
            || { echo "::error::/api/open-login-items did not open the pane on the installed daemon"; exit 1; }
          # Control: the same fetch against a port with nothing on it must fail,
          # or the two assertions above would pass on any reachable machine.
          if curl -fsS --max-time 3 "http://127.0.0.1:1/" > /dev/null 2>&1; then
            echo "::error::control broken: a dead port answered"; exit 1; fi
          kill "$ctl_daemon" 2>/dev/null || true
          echo "installed daemon serves its control page, reports an idle pipeline, and sees its login agent"
          echo "== macOS installer gate: PASS =="

      - name: "Payload signatures: measured on the INSTALLED binaries a user gets"
        run: |
          set -euo pipefail
          if [ -z "${NAUDIO_CODESIGN_IDENTITY:-}" ]; then
            echo "::warning::no identity was imported — skipping the payload assertion"
            exit 0
          fi
          # Measured on what the installer gate above just placed under /usr/local, not on a
          # re-expansion of the .pkg. Two reasons. It is the stronger claim — these are the
          # bytes a user ends up running — and it needs no pkgutil --expand-full, whose
          # failure on this runner was invisible because its diagnostics go to STDOUT and an
          # earlier draft redirected that to /dev/null. Nothing here swallows output.
          APP="/Applications/Network Audio Service.app"
          n=0
          entitled=0
          for f in /usr/local/bin/na_wav_tap /usr/local/bin/na_audio_daemon \
                   /usr/local/bin/na_audio_source /usr/local/bin/na_c_play_to_speakers \
                   "$APP/Contents/MacOS/na_audio_daemon" \
                   /usr/local/lib/libnaudio.*.*.*.dylib; do
            test -e "$f" || { echo "::error::$f is not installed — the gate above should have"; exit 1; }
            n=$((n+1))
            desc=$(codesign -dvv "$f" 2>&1)
            case "$desc" in
              *"Authority=Developer ID Application"*) ;;
              *) echo "::error::$(basename "$f") is not Developer ID signed — the notary would reject it"
                 echo "$desc"; exit 1 ;;
            esac
            case "$desc" in
              *runtime*) ;;
              *) echo "::error::$(basename "$f") lacks the hardened runtime"; echo "$desc"; exit 1 ;;
            esac
            # The hardened runtime denies the microphone to a process whose signature does not
            # claim it. Measured 2026-09-02 on a hardened daemon WITHOUT the entitlement: run
            # from a terminal it captured (TCC charges the terminal), run by launchd — the
            # path the .pkg registers — it read two seconds of -120 dBFS silence, exit 0, no
            # error. So the two capture tools must carry it and the other three must not.
            ents=$(codesign -d --entitlements - "$f" 2>/dev/null || true)
            case "$(basename "$f")" in
              na_audio_daemon|na_audio_source)
                case "$ents" in
                  *com.apple.security.device.audio-input*) entitled=$((entitled+1)) ;;
                  *) echo "::error::$(basename "$f") lacks the audio-input entitlement — as a launchd agent it would capture silence"
                     echo "$ents"; exit 1 ;;
                esac ;;
              *)
                case "$ents" in
                  *audio-input*) echo "::error::$(basename "$f") carries the audio-input entitlement and opens no input device"; exit 1 ;;
                esac ;;
            esac
            echo "  ok: $(basename "$f")"
          done
          # Cardinality (L230), the same 6 the installer gate scans: four executables, the
          # daemon twice, plus libnaudio. A loop that matched nothing would otherwise report
          # success. And exactly the capture tools entitled — both daemon copies and the
          # source — a renamed tool would otherwise ship unable to hear.
          [ "$n" -eq 6 ] || { echo "::error::expected 6 signed binaries, saw $n"; exit 1; }
          [ "$entitled" -eq 3 ] || { echo "::error::expected 3 entitled capture tools, saw $entitled"; exit 1; }

          # Network Audio Service.app (#102, #105): sealed in CPack staging, its executable
          # written back and its seal carried as loose files, reassembled by the postinstall
          # — so the only bundle worth verifying is the INSTALLED one. Its Team ID must be
          # the installed daemon's: Background Task Management names the agent after the app
          # only when they match, and drops the association silently otherwise. A relation
          # between two installed files, not a literal team id. And its executable must be
          # signed AS the bundle — the identifier the seal binds it under is the bundle's,
          # which is what TCC keys the Microphone grant on.
          codesign --verify --deep --strict "$APP" \
            || { echo "::error::$APP does not verify after the postinstall assembled it"; exit 1; }
          app_desc=$(codesign -dvv "$APP" 2>&1)
          case "$app_desc" in
            *"Authority=Developer ID Application"*) ;;
            *) echo "::error::$APP is not Developer ID signed"; echo "$app_desc"; exit 1 ;;
          esac
          app_id=$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")
          exec_id=$(codesign -dvv "$APP/Contents/MacOS/na_audio_daemon" 2>&1 | sed -n 's/^Identifier=//p')
          [ -n "$app_id" ] && [ "$exec_id" = "$app_id" ] \
            || { echo "::error::$APP's executable is signed as '$exec_id', not as the bundle ('$app_id') — TCC would key the Microphone grant on a file, not the service"; exit 1; }
          app_team=$(printf '%s\n' "$app_desc" | sed -n 's/^TeamIdentifier=//p')
          daemon_team=$(codesign -dvv /usr/local/bin/na_audio_daemon 2>&1 | sed -n 's/^TeamIdentifier=//p')
          [ -n "$app_team" ] && [ "$app_team" = "$daemon_team" ] \
            || { echo "::error::$APP's TeamIdentifier ('$app_team') is not the daemon's ('$daemon_team') — Login Items would drop the association"; exit 1; }
          echo "  ok: $APP (TeamIdentifier $app_team)"
          echo "== payload: $n installed binaries Developer ID signed with the hardened runtime; $entitled carry audio-input; $APP sealed with the daemon's team id =="

      - name: "Sign the .pkg, notarize it, staple the ticket"
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${NAUDIO_PRODUCTSIGN_IDENTITY:-}" ]; then
            echo "::warning::no Developer ID Installer identity — the .pkg ships unsigned and the note will say so"
            exit 0
          fi
          # An Installer identity with no notary credential is a misconfiguration, not a
          # degraded mode: a signed-but-unnotarized .pkg still trips Gatekeeper, and the note
          # would (correctly) call it unsigned. Name the missing secret and stop.
          # APPLE_APP_SPECIFIC_PASSWORD is the one notarytool takes — `--password` wants an
          # app-specific password, not the Apple ID's own (that is APPLE_ID_PASSWORD). Its
          # org visibility is PRIVATE, so the day this repository goes public it stops
          # resolving here, and this is the line that will say so.
          [ -n "${APPLE_ID:-}" ] || { echo "::error::APPLE_ID is empty — cannot notarize"; exit 1; }
          [ -n "${APPLE_TEAM_ID:-}" ] || { echo "::error::APPLE_TEAM_ID is empty — cannot notarize"; exit 1; }
          [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] \
            || { echo "::error::APPLE_APP_SPECIFIC_PASSWORD is empty (org secret missing, or not visible to this repository) — cannot notarize"; exit 1; }

          pkg=$(ls build/naudio-*.pkg)
          signed="$RUNNER_TEMP/$(basename "$pkg")"
          echo "productsign: $(basename "$pkg")"
          productsign --sign "$NAUDIO_PRODUCTSIGN_IDENTITY" --keychain "$NAUDIO_KEYCHAIN" \
                      --timestamp "$pkg" "$signed"
          # Assert on the artifact, not the exit code: the wrapper must now name the
          # Installer certificate.
          pkgutil --check-signature "$signed" | tee "$RUNNER_TEMP/check-signature.txt"
          grep -q 'Developer ID Installer' "$RUNNER_TEMP/check-signature.txt" \
            || { echo "::error::productsign exited 0 but the .pkg carries no Developer ID Installer signature"; exit 1; }

          # Apple validates every Mach-O inside the package as well as the wrapper. The
          # verdict is the status field, never the exit code (L111's shape), so it is read
          # back explicitly; JSON goes to a file and stderr stays visible (L335).
          echo "notarytool submit --wait (Apple's queue; usually a few minutes)"
          set +e
          xcrun notarytool submit "$signed" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
                --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait --timeout 30m \
                --output-format json > "$RUNNER_TEMP/notary.json"
          submit_rc=$?
          set -e
          cat "$RUNNER_TEMP/notary.json"; echo
          nid=$(jq -r '.id // empty' "$RUNNER_TEMP/notary.json")
          nstatus=$(jq -r '.status // empty' "$RUNNER_TEMP/notary.json")
          echo "notary: rc=$submit_rc id=${nid:-none} status=${nstatus:-none}"
          if [ "$nstatus" != Accepted ]; then
            # The reason lives only in the log, one more call away (2ae8cbb).
            if [ -n "$nid" ]; then
              xcrun notarytool log "$nid" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
                    --password "$APPLE_APP_SPECIFIC_PASSWORD" || true
            fi
            echo "::error::notarization did not end in Accepted (status: ${nstatus:-none}, rc=$submit_rc)"
            exit 1
          fi

          xcrun stapler staple "$signed"
          xcrun stapler validate "$signed"
          spctl -a -vv -t install "$signed"
          # The artifact the upload step and the signing-status step see is now the signed,
          # notarized, stapled one — same name, same place. The installer gate above ran the
          # unsigned wrapper around this identical payload; productsign and the ticket change
          # no payload byte.
          mv "$signed" "$pkg"
          echo "== .pkg signed by '$NAUDIO_PRODUCTSIGN_IDENTITY', notarized ($nid), stapled =="

      - name: Remove the signing keychain
        if: always()
        run: |
          if [ -n "${NAUDIO_KEYCHAIN:-}" ]; then security delete-keychain "$NAUDIO_KEYCHAIN" || true; fi

      - name: "Signing status: measured on the .pkg in both directions, never assumed (#99)"
        run: |
          set -euo pipefail
          pkg=$(ls build/naudio-*.pkg)

          # THE NEGATIVE CONTROL RUNS FIRST. A detector stuck at one answer would be
          # indistinguishable from a correct one, so require the measurement to convict a
          # package that is unsigned by construction before believing what it says about
          # ours (L222: an absence is a measurement only once something has produced a
          # presence).
          mkdir -p /tmp/signing-control/payload
          echo control > /tmp/signing-control/payload/control.txt
          pkgbuild --root /tmp/signing-control/payload \
                   --identifier org.kj5hst.naudio.signing-control \
                   --version 1 /tmp/signing-control/control.pkg > /dev/null
          ctl=$(packaging/macos/signing-status.sh /tmp/signing-control/control.pkg 2>/dev/null)
          if [ "$ctl" != unsigned ]; then
            echo "::error::the signing detector called an unsigned package '$ctl' — its verdict on the real .pkg cannot be believed"
            exit 1
          fi
          echo "negative control: a package with no signature measures as 'unsigned'"

          status=$(packaging/macos/signing-status.sh "$pkg")
          echo "$status" > build/macos-signing-status.txt
          # THE POSITIVE DIRECTION. When the step above signed, notarized and stapled this
          # .pkg, the detector must say so: a detector that can only convict is half a
          # detector, and until 2026-09-02 this was the half no runner could exercise. A run
          # with no Installer identity stays a measurement only — the note says "unsigned",
          # and that is the truth about that artifact.
          if [ -n "${NAUDIO_PRODUCTSIGN_IDENTITY:-}" ] && [ "$status" != signed ]; then
            echo "::error::the .pkg was signed, notarized and stapled, yet measures '$status' — the signing step or the detector is broken; publishing nothing"
            exit 1
          fi
          echo "== macOS .pkg signing status: $status =="

      - uses: actions/upload-artifact@v4
        with:
          name: package-macos
          path: |
            build/naudio-*.tar.gz
            build/naudio-*.pkg
            build/macos-signing-status.txt
          if-no-files-found: error

  package-linux:
    name: package (linux, TGZ + DEB + RPM)
    runs-on: ubuntu-latest
    needs: version-guard
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build deps (ALSA for the bundled PortAudio; rpm for cpack; NO portaudio19-dev)
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config build-essential rpm

      - name: Derive the pre-release suffix from the tag (empty on final tags and dry runs)
        run: echo "NAUDIO_PKG_SUFFIX=$(echo "${GITHUB_REF_NAME}" | sed -n 's/^v[0-9.]*\(rc[0-9][0-9]*\)$/\1/p')" >> "$GITHUB_ENV"

      - name: Configure (release shape — no bridge, no hamlib; prefix /usr so DEB/RPM metadata is truthful after install)
        run: |
          # CMAKE_INSTALL_LIBDIR is pinned: with prefix /usr on a Debian-family
          # host, GNUInstallDirs otherwise switches to the multiarch
          # lib/x86_64-linux-gnu — measured by this gate's first run, where the
          # tarball's lib/ globs went literal while the tools still ran (their
          # rpath derives from CMAKE_INSTALL_LIBDIR and followed it). A plain
          # lib/ keeps the relocatable tarball layout uniform across platforms,
          # and /usr/lib is a loader-trusted directory on both DEB and RPM
          # families (pkg-config's default search covers /usr/lib/pkgconfig on
          # Debian; on RPM distros the .pc needs PKG_CONFIG_PATH — a GitHub
          # convenience RPM, not distro-official packaging, per the issue's
          # non-goals).
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
                -DNAUDIO_BUNDLE_PORTAUDIO=ON \
                -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=lib \
                -DNAUDIO_PKG_VERSION_SUFFIX="${{ env.NAUDIO_PKG_SUFFIX }}"

      - name: Build
        run: cmake --build build -j

      - name: Assert the four shipped binaries were built — never the build's exit code
        run: |
          for t in tools/na_audio_daemon tools/na_wav_tap \
                   examples/na_audio_source examples/na_c_play_to_speakers; do
            test -x "build/$t" || { echo "::error::$t was not built"; exit 1; }
          done

      - name: Test (full suite)
        run: ctest --test-dir build --output-on-failure

      - name: Package (TGZ + DEB + RPM)
        run: cd build && cpack -G TGZ && cpack -G DEB && cpack -G RPM

      - name: "Package gate 1/3: tarball — unpack, consume, run, scan"
        run: |
          set -euo pipefail
          pkg=$(ls build/naudio-*.tar.gz)
          mkdir -p "${{ runner.temp }}/pkg"
          tar xzf "$pkg" -C "${{ runner.temp }}/pkg" --strip-components 1
          P="${{ runner.temp }}/pkg"

          "$P/bin/na_wav_tap" --help > /dev/null
          "$P/bin/na_audio_daemon" -h > /dev/null 2>&1
          "$P/bin/na_audio_source" --help > /dev/null
          "$P/bin/na_c_play_to_speakers" --help > /dev/null
          echo 'all four shipped binaries run env-free from the tarball ($ORIGIN rpath)'

          # Self-containment: no hamlib/portaudio/samplerate/libusb reference and
          # no unresolvable library. libasound &co are fine — they are what
          # dpkg-shlibdeps declares. The hamlib term now guards the operator
          # decision directly: NOTHING in the package may reference any hamlib.
          # Cardinality-checked: exactly 5 binaries (2 tools + the demo pair +
          # libnaudio) — a packaged bridge would trip the count.
          scanned=0
          for f in "$P"/bin/* "$P"/lib/libnaudio.so.*.*; do
            scanned=$((scanned+1))
            ldd "$f" > ldd.out
            if grep -Ei 'hamlib|portaudio|samplerate|libusb' ldd.out; then
              echo "::error::$f references a library the package must not depend on"; exit 1; fi
            if grep -F 'not found' ldd.out | grep -v 'libnaudio'; then
              echo "::error::$f has unresolvable dependencies"; exit 1; fi
          done
          [ "$scanned" -eq 5 ] || { echo "::error::expected to scan 5 binaries, scanned $scanned"; exit 1; }
          echo "ldd scan clean over $scanned binaries"

          cmake -S tests/external-consumer -B consumer-build -DCMAKE_PREFIX_PATH="$P" > consumer.log 2>&1 \
            || { cat consumer.log; echo "::error::find_package(naudio) failed against the tarball"; exit 1; }
          grep -E 'external-consumer: naudio_pa arm (ENABLED|SKIPPED)' consumer.log
          cmake --build consumer-build -j > /dev/null
          LD_LIBRARY_PATH="$P/lib" ./consumer-build/consume_c   | tee -a consume.log
          LD_LIBRARY_PATH="$P/lib" ./consumer-build/consume_cxx | tee -a consume.log
          grep -q '^consume_c OK'   consume.log || { echo "::error::consume_c did not run"; exit 1; }
          grep -q '^consume_cxx OK' consume.log || { echo "::error::consume_cxx did not run"; exit 1; }

          cflags=$(PKG_CONFIG_PATH="$P/lib/pkgconfig" pkg-config --define-prefix --cflags naudio)
          libs=$(PKG_CONFIG_PATH="$P/lib/pkgconfig" pkg-config --define-prefix --libs naudio)
          cc $cflags tests/external-consumer/consume_c.c $libs -o consume_c_pc
          LD_LIBRARY_PATH="$P/lib" ./consume_c_pc | grep -q '^consume_c OK' \
            || { echo "::error::pkg-config consumer did not run"; exit 1; }
          echo "== tarball gate: PASS =="

      - name: "Package gate 2/3: DEB — actually install it, then consume /usr"
        run: |
          set -euo pipefail
          # THE package-based install the acceptance criterion asks for: the real
          # package manager placing real files under /usr, not an unpacked image.
          sudo apt-get install -y ./build/naudio-*.deb
          sudo ldconfig
          dpkg -s naudio | sed -n '1,8p'

          na_wav_tap --help > /dev/null
          na_audio_daemon -h > /dev/null 2>&1
          na_audio_source --help > /dev/null
          na_c_play_to_speakers --help > /dev/null
          if command -v na_hamlib_bridge > /dev/null; then
            echo "::error::na_hamlib_bridge was installed by the DEB — the bridge must not be packaged"; exit 1; fi
          echo "all four shipped binaries run from /usr/bin (and the bridge is absent, as intended)"

          cmake -S tests/external-consumer -B deb-consumer > deb-consumer.log 2>&1 \
            || { cat deb-consumer.log; echo "::error::find_package(naudio) failed against the installed DEB"; exit 1; }
          cmake --build deb-consumer -j > /dev/null
          ./deb-consumer/consume_c   | tee -a deb-consume.log
          ./deb-consumer/consume_cxx | tee -a deb-consume.log
          grep -q '^consume_c OK'   deb-consume.log || { echo "::error::consume_c did not run"; exit 1; }
          grep -q '^consume_cxx OK' deb-consume.log || { echo "::error::consume_cxx did not run"; exit 1; }

          # /usr/lib/pkgconfig is on pkg-config's default path — no env needed.
          cc $(pkg-config --cflags naudio) tests/external-consumer/consume_c.c \
             $(pkg-config --libs naudio) -o deb_consume_c_pc
          ./deb_consume_c_pc | grep -q '^consume_c OK' \
            || { echo "::error::pkg-config consumer did not run against the DEB"; exit 1; }

          # --- Service registration (#96 item 2) ------------------------------
          # The DEB carries the unit itself — no postinst needed, unlike the
          # .pkg, because /usr/lib/systemd/user IS under the package prefix.
          UNIT=/usr/lib/systemd/user/naudio-daemon.service
          test -f "$UNIT" || { echo "::error::the DEB did not install $UNIT"; exit 1; }

          # It must name a binary the package actually placed — the failure a
          # build-tree test structurally cannot see.
          unit_exec=$(sed -n 's/^ExecStart=\([^ ]*\).*/\1/p' "$UNIT")
          test -x "$unit_exec" \
            || { echo "::error::unit names '$unit_exec', which the DEB did not install"; exit 1; }

          # Installing must not start capturing a microphone at the next login:
          # the unit ships AVAILABLE, never enabled. Absence needs a control, so
          # the wants directory is first proven to be where an enable would land.
          grep -q '^WantedBy=default.target$' "$UNIT" \
            || { echo "::error::control broken: unit does not install into default.target"; exit 1; }
          for w in /etc/systemd/user/default.target.wants "$HOME/.config/systemd/user/default.target.wants"; do
            if [ -e "$w/naudio-daemon.service" ]; then
              echo "::error::the DEB enabled the service — it must ship available, not enabled"; exit 1; fi
          done
          # The unit runs CONTROL mode (#96 item 4), which is what makes
          # enabling the service give an operator a page rather than an open
          # microphone. Asserted on the INSTALLED unit, not on the template.
          grep -q '^ExecStart=.* --mode control ' "$UNIT" \
            || { echo "::error::the installed unit does not run --mode control"; sed -n '/^ExecStart=/p' "$UNIT"; exit 1; }
          echo "systemd user unit installed at $UNIT, not enabled, pointing at $unit_exec"

          # --- The control page (#96 item 4) ---------------------------------
          # The desktop entry: the shortcut #96's acceptance names. Unlike the
          # unit it needs no postinst either — share/applications is under /usr.
          DESKTOP=/usr/share/applications/naudio-control.desktop
          test -f "$DESKTOP" || { echo "::error::the DEB did not install $DESKTOP"; exit 1; }
          if command -v desktop-file-validate > /dev/null; then
            desktop-file-validate "$DESKTOP" \
              || { echo "::error::$DESKTOP is not a valid desktop entry"; exit 1; }
          else
            echo "note: no desktop-file-validate on this runner; structure not validated"
          fi
          # It must launch a binary the package actually placed, in control mode.
          desktop_exec=$(sed -n 's/^Exec=\([^ ]*\).*/\1/p' "$DESKTOP")
          test -x "$desktop_exec" \
            || { echo "::error::$DESKTOP execs '$desktop_exec', which the DEB did not install"; exit 1; }
          grep -q '^Exec=.* --mode control ' "$DESKTOP" \
            || { echo "::error::$DESKTOP does not launch control mode"; exit 1; }
          # Its name is the service's name on every platform — "Network Audio
          # Service", what /Applications holds on a Mac and the Start menu on
          # Windows — read off the INSTALLED entry, and the unit's Description=
          # (what `systemctl --user status` prints) leads with the same string.
          desktop_name=$(sed -n 's/^Name=\(.*\)$/\1/p' "$DESKTOP")
          [ "$desktop_name" = "Network Audio Service" ] \
            || { echo "::error::$DESKTOP's Name= is '$desktop_name', not the service's name"; exit 1; }
          unit_desc=$(sed -n 's/^Description=\(.*\)$/\1/p' "$UNIT")
          case "$unit_desc" in
            "Network Audio Service"|"Network Audio Service "*) ;;
            *) echo "::error::$UNIT's Description= is '$unit_desc' — it does not lead with the service's name"; exit 1 ;;
          esac
          echo "  name: $desktop_name (desktop entry); unit: $unit_desc"
          # Its icon (#103): Icon= is a theme NAME the desktop resolves through
          # share/icons/hicolor/<size>/apps/<name>.png, so the assertion is the
          # relation — the entry's name, and a PNG of that name at every size
          # the checked-in tree carries. Nine sizes, like the tree; a size that
          # went missing from the package would leave some launcher on the
          # generic icon with nothing else red.
          desktop_icon=$(sed -n 's/^Icon=\(.*\)$/\1/p' "$DESKTOP")
          [ -n "$desktop_icon" ] && [ "$desktop_icon" = naudio ] \
            || { echo "::error::$DESKTOP's Icon= is '$desktop_icon', not the theme name naudio"; exit 1; }
          icon_sizes=0
          for s in 16 22 24 32 48 64 128 256 512; do
            f="/usr/share/icons/hicolor/${s}x${s}/apps/${desktop_icon}.png"
            test -f "$f" || { echo "::error::the DEB did not install $f — the desktop's ${s}px launchers would fall back to the generic icon"; exit 1; }
            file "$f" | grep -q "PNG image data, $s x $s" \
              || { echo "::error::$f is not a ${s}×${s} PNG: $(file "$f")"; exit 1; }
            icon_sizes=$((icon_sizes+1))
          done
          [ "$icon_sizes" -eq 9 ] || { echo "::error::expected 9 icon sizes, checked $icon_sizes"; exit 1; }
          echo "  icon: Icon=$desktop_icon resolves at 9 hicolor sizes"

          # BEHAVIOUR on the installed binary: serve the page and answer the
          # poll the browser makes. Hardware-free — nothing here starts a stream.
          "$unit_exec" --mode control --control-port 0 --autostart false \
                       --no-config --duration-ms 20000 > /tmp/ctl.log 2>&1 &
          ctl_daemon=$!
          url=""
          for _ in $(seq 1 50); do
            url=$(sed -n 's/^control page : //p' /tmp/ctl.log)
            [ -n "$url" ] && break
            sleep 0.2
          done
          [ -n "$url" ] || { echo "::error::the installed daemon served no control page"; cat /tmp/ctl.log; exit 1; }
          curl -fsS "$url" | grep -q 'naudio control' \
            || { echo "::error::the installed daemon's control page is not the control page"; exit 1; }
          curl -fsS "${url}api/state" | grep -q '"state":"idle"' \
            || { echo "::error::the installed daemon's /api/state did not report an idle pipeline"; exit 1; }
          # The page's "Runs at login" row (#102): the installed daemon must see
          # the user unit the package placed at $UNIT. "enabled" reads false — the
          # unit ships inert and nothing here enabled it — and the route that
          # opens macOS's pane is a 404 that says so on this platform.
          svc=$(curl -fsS "${url}api/state" | sed -n 's/.*"service":{\([^}]*\)}.*/\1/p')
          case "$svc" in
            *'"manager":"systemd"'*'"installed":true'*'"enabled":false'*) echo "  service: $svc" ;;
            *) echo "::error::the installed daemon does not see its own inert systemd unit: service={$svc}"; exit 1 ;;
          esac
          curl -s -X POST -H 'Content-Type: application/json' -d '{}' "${url}api/open-login-items" \
            | grep -q 'macOS' \
            || { echo "::error::/api/open-login-items is not the platform-shaped 404 on Linux"; exit 1; }
          # Control: a port with nothing on it must NOT answer, or the two
          # assertions above would pass anywhere.
          if curl -fsS --max-time 3 "http://127.0.0.1:1/" > /dev/null 2>&1; then
            echo "::error::control broken: a dead port answered"; exit 1; fi
          kill "$ctl_daemon" 2>/dev/null || true
          echo "installed daemon serves its control page, reports an idle pipeline, and sees its inert unit"
          echo "== DEB gate: PASS =="

      - name: "Package gate 3/3: RPM — content assertions (no rpm host here to install on)"
        run: |
          set -euo pipefail
          rpm=$(ls build/naudio-*.rpm)
          rpm -qlp "$rpm" > rpm-contents.txt
          for want in /usr/bin/na_audio_daemon /usr/bin/na_wav_tap \
                      /usr/bin/na_audio_source /usr/bin/na_c_play_to_speakers \
                      /usr/include/naudio.h /usr/lib/pkgconfig/naudio.pc \
                      /usr/lib/systemd/user/naudio-daemon.service \
                      /usr/share/applications/naudio-control.desktop \
                      /usr/share/icons/hicolor/16x16/apps/naudio.png \
                      /usr/share/icons/hicolor/256x256/apps/naudio.png \
                      /usr/share/icons/hicolor/512x512/apps/naudio.png; do
            grep -qx "$want" rpm-contents.txt \
              || { echo "::error::RPM is missing $want"; cat rpm-contents.txt; exit 1; }
          done
          if grep -q 'na_hamlib_bridge' rpm-contents.txt; then
            echo "::error::RPM carries na_hamlib_bridge — the bridge must not be packaged"; exit 1; fi
          echo "RPM carries the four binaries, the header and the pkgconfig file; no bridge"

      - uses: actions/upload-artifact@v4
        with:
          name: package-linux
          path: |
            build/naudio-*.tar.gz
            build/naudio-*.deb
            build/naudio-*.rpm
          if-no-files-found: error

  package-windows:
    name: package (windows, ZIP + installer .exe — lib + headers + the daemon + na_wav_tap + the demo pair)
    runs-on: windows-latest
    needs: version-guard
    steps:
      - uses: actions/checkout@v4

      - name: Derive the pre-release suffix from the tag (empty on final tags and dry runs)
        shell: bash
        run: echo "NAUDIO_PKG_SUFFIX=$(echo "${GITHUB_REF_NAME}" | sed -n 's/^v[0-9.]*\(rc[0-9][0-9]*\)$/\1/p')" >> "$GITHUB_ENV"

      - name: Configure (bundled PortAudio; apps ON so na_wav_tap ships — ci.yml's windows-wav-tap rationale)
        run: cmake -S . -B build -DNAUDIO_BUNDLE_PORTAUDIO=ON -DNAUDIO_PKG_VERSION_SUFFIX="${{ env.NAUDIO_PKG_SUFFIX }}"

      - name: Build
        run: cmake --build build --config Release -j

      - name: Test (full suite)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        run: cd build; cpack -G ZIP -C Release

      - name: "Package gate: expand, consume, run"
        shell: pwsh
        run: |
          $zip = Get-ChildItem build/naudio-*.zip | Select-Object -First 1
          if (-not $zip) { Write-Output "::error::no ZIP produced"; exit 1 }
          Expand-Archive $zip.FullName -DestinationPath "${{ runner.temp }}/pkgroot"
          $P = Get-ChildItem "${{ runner.temp }}/pkgroot" | Select-Object -First 1

          # The shipped Windows binaries. naudio.dll sits beside them in bin/.
          #
          # na_audio_daemon joined them in this release (issue #96 item 3): until its WIN32 build
          # gate came off, the Windows package carried a client and a demo but not the thing an
          # operator actually configures and runs.
          & "$($P.FullName)/bin/na_audio_daemon.exe" --help
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::na_audio_daemon.exe from the package will not run"; exit 1 }
          & "$($P.FullName)/bin/na_wav_tap.exe" --help
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::na_wav_tap.exe from the package will not run"; exit 1 }
          & "$($P.FullName)/bin/na_audio_source.exe" --help
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::na_audio_source.exe from the package will not run"; exit 1 }
          & "$($P.FullName)/bin/na_c_play_to_speakers.exe" --help
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::na_c_play_to_speakers.exe from the package will not run"; exit 1 }

          # The windowed daemon (na_audio_daemonw.exe): the same program for the GUI subsystem,
          # which the logon task and the shortcut run so no console window appears. Two
          # relations, read off the PE headers rather than assumed from the CMake flag: the
          # windowed build's Subsystem field is 2 (WINDOWS_GUI) and the console build's is 3
          # (WINDOWS_CUI) — the console one is the control that the reader reads the field.
          # Then it must run: Start-Process -Wait, because PowerShell does not wait for a GUI
          # process it invoked bare; with no stdout handed to it, its usage text goes to its
          # log file, and that file must say so.
          function Get-PeSubsystem([string]$path) {
            $b = [System.IO.File]::ReadAllBytes($path)
            $pe = [BitConverter]::ToInt32($b, 0x3C)
            # PE signature (4) + COFF file header (20), then Subsystem at +0x44 of the optional
            # header for PE32 and PE32+ alike.
            return [BitConverter]::ToUInt16($b, $pe + 4 + 20 + 0x44)
          }
          $subW = Get-PeSubsystem "$($P.FullName)/bin/na_audio_daemonw.exe"
          $subC = Get-PeSubsystem "$($P.FullName)/bin/na_audio_daemon.exe"
          if ($subC -ne 3) { Write-Output "::error::control broken: na_audio_daemon.exe's PE Subsystem reads $subC, not 3 (console) — the reader cannot be believed"; exit 1 }
          if ($subW -ne 2) { Write-Output "::error::na_audio_daemonw.exe's PE Subsystem is $subW, not 2 (Windows GUI) — it would open a console window"; exit 1 }
          $wlog = "$env:LOCALAPPDATA\naudio\daemon.log"
          if (Test-Path $wlog) { Remove-Item $wlog }
          $pw = Start-Process -Wait -PassThru -FilePath "$($P.FullName)/bin/na_audio_daemonw.exe" -ArgumentList '--help'
          if ($pw.ExitCode -ne 0) { Write-Output "::error::na_audio_daemonw.exe --help exited $($pw.ExitCode)"; exit 1 }
          if (-not (Test-Path $wlog)) { Write-Output "::error::na_audio_daemonw.exe wrote no log at $wlog — a bare launch has nowhere else to print"; exit 1 }
          if (-not (Select-String -Path $wlog -Pattern '^usage: na_audio_daemon' -Quiet)) {
            Write-Output "::error::the windowed daemon's log carries no usage text"; Get-Content $wlog; exit 1 }
          Write-Output "na_audio_daemonw.exe: PE subsystem $subW (console build $subC); --help exit 0 with its usage in $wlog"

          # Runtime proof ON THE ARTIFACT: test-tone server -> null-backend client,
          # byte-tell asserted (examples/README.md) — no audio device involved.
          $srv = Start-Process -PassThru -NoNewWindow -FilePath "$($P.FullName)/bin/na_audio_source.exe" `
                 -ArgumentList '--test-tone','--seconds','25'
          Start-Sleep -Seconds 3
          & "$($P.FullName)/bin/na_c_play_to_speakers.exe" --backend null --seconds 5 2>&1 |
            Tee-Object -FilePath demo.log
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::demo client exited $LASTEXITCODE"; exit 1 }
          if (-not (Select-String -Path demo.log -Pattern 'first_frame_hex=68c569c66ac76bc8' -Quiet)) {
            Write-Output "::error::stream byte-tell missing — the packaged pair did not stream"; exit 1 }
          Stop-Process -Id $srv.Id -ErrorAction SilentlyContinue
          Write-Output "packaged demo pair streams end to end on Windows"

          cmake -S tests/external-consumer -B consumer-build -DCMAKE_PREFIX_PATH="$($P.FullName)" 2>&1 |
            Tee-Object -FilePath consumer.log
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::find_package(naudio) failed against the ZIP"; exit 1 }
          if (-not (Select-String -Path consumer.log -Pattern 'naudio_pa arm SKIPPED' -Quiet)) {
            Write-Output "::error::expected the naudio_pa arm to be SKIPPED on a host with no PortAudio"; exit 1
          }
          cmake --build consumer-build --config Release
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::consumer build failed"; exit 1 }

          $env:PATH = "$($P.FullName)/bin;" + $env:PATH
          & "consumer-build/Release/consume_c.exe"   2>&1 | Tee-Object -FilePath consume.log
          & "consumer-build/Release/consume_cxx.exe" 2>&1 | Tee-Object -FilePath consume.log -Append
          if (-not (Select-String -Path consume.log -Pattern '^consume_c OK' -Quiet)) {
            Write-Output "::error::consume_c did not run"; exit 1 }
          if (-not (Select-String -Path consume.log -Pattern '^consume_cxx OK' -Quiet)) {
            Write-Output "::error::consume_cxx did not run"; exit 1 }
          Write-Output "== Windows package gate: PASS =="

      - name: Ensure NSIS is present (NOT in the windows-latest image — measured 2026-08-31; choco shims nothing for makensis, so PATH gains the install dir)
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
            $nsis = 'C:\Program Files (x86)\NSIS'
            if (-not (Test-Path "$nsis\makensis.exe")) {
              Write-Output "::error::makensis.exe not at $nsis after choco install — the package layout moved"; exit 1 }
            Add-Content -Path $env:GITHUB_PATH -Value $nsis
            $env:PATH = "$nsis;$env:PATH"
          }
          makensis /VERSION
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::makensis will not run"; exit 1 }

      - name: Package (installer — NSIS setup .exe, runtime+tools payload)
        run: cd build; cpack -G NSIS -C Release

      - name: "Installer gate: silent-install the .exe, run, stream, assert dev files absent, uninstall"
        shell: pwsh
        run: |
          $exe = Get-ChildItem build/naudio-*.exe | Select-Object -First 1
          if (-not $exe) { Write-Output "::error::no NSIS installer produced"; exit 1 }
          Write-Output "installer: $($exe.Name)"

          # Positive control FIRST (L222): the dev-absence assertions below can
          # only fire if the full tree really carries those paths — the ZIP
          # tree the package gate expanded does.
          $zipTree = Get-ChildItem "${{ runner.temp }}/pkgroot" | Select-Object -First 1
          foreach ($present in 'include/naudio.h','lib/naudio.lib') {
            if (-not (Test-Path "$($zipTree.FullName)/$present")) {
              Write-Output "::error::control broken: ZIP tree lacks $present — absence checks prove nothing"; exit 1 } }

          # Control for the logon-task assertions below (L222): the task must be
          # ABSENT before the install, or finding it afterwards says nothing about
          # who registered it.
          $TaskPath = '\naudio\'
          $TaskName = 'naudio-daemon'
          if (Get-ScheduledTask -TaskPath $TaskPath -TaskName $TaskName -ErrorAction SilentlyContinue) {
            Write-Output "::error::control broken: the logon task existed before the install"; exit 1 }

          $proc = Start-Process -PassThru -Wait -FilePath $exe.FullName -ArgumentList '/S'
          if ($proc.ExitCode -ne 0) { Write-Output "::error::silent install exited $($proc.ExitCode)"; exit 1 }
          $I = "$env:ProgramFiles\naudio"

          # The shipped binaries and the uninstaller are in place; the tools run
          # from the installed tree (naudio.dll beside them in bin/).
          foreach ($f in 'bin/na_audio_daemon.exe','bin/na_audio_daemonw.exe','bin/na_wav_tap.exe','bin/na_audio_source.exe','bin/na_c_play_to_speakers.exe','bin/naudio.dll','Uninstall.exe') {
            if (-not (Test-Path "$I/$f")) { Write-Output "::error::installed tree is missing $f"; exit 1 } }
          & "$I/bin/na_wav_tap.exe" --help
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::installed na_wav_tap.exe will not run"; exit 1 }

          # The icon (#103). Explorer, the taskbar and the Start-menu shortcut show the
          # daemon's own icon resource, so the assertion is on the INSTALLED binary:
          # ExtractIconEx with index -1 returns how many icons a file carries — 0 for an
          # executable with no resource. The control (L222) is na_wav_tap.exe, a console
          # tool deliberately built without one: the same call must return 0 there, or a
          # shell-supplied default would be counted as ours. The setup .exe's and the
          # uninstaller's own icon come from MUI_ICON/MUI_UNIICON, asserted on the .nsi
          # CPack generated, because an NSIS stub carries a default icon either way and a
          # count cannot tell the two apart.
          Add-Type -Namespace Naudio -Name Shell -MemberDefinition '[DllImport("shell32.dll", CharSet=CharSet.Unicode)] public static extern uint ExtractIconEx(string file, int index, IntPtr[] large, IntPtr[] small, uint n);'
          $daemonIcons = [Naudio.Shell]::ExtractIconEx("$I\bin\na_audio_daemon.exe", -1, $null, $null, 0)
          $tapIcons = [Naudio.Shell]::ExtractIconEx("$I\bin\na_wav_tap.exe", -1, $null, $null, 0)
          if ($tapIcons -ne 0) {
            Write-Output "::error::control broken: na_wav_tap.exe reports $tapIcons icon(s) and carries none — the count cannot be believed"; exit 1 }
          if ($daemonIcons -lt 1) {
            Write-Output "::error::na_audio_daemon.exe carries no icon resource — Explorer and the Start-menu shortcut would show the generic one"; exit 1 }
          # The windowed build is the shortcut's target and the tray icon's source, so it must
          # carry the resource too.
          $daemonwIcons = [Naudio.Shell]::ExtractIconEx("$I\bin\na_audio_daemonw.exe", -1, $null, $null, 0)
          if ($daemonwIcons -lt 1) {
            Write-Output "::error::na_audio_daemonw.exe carries no icon resource — the shortcut and the tray would show the generic one"; exit 1 }
          $nsi = Get-ChildItem build/_CPack_Packages -Recurse -Filter project.nsi | Select-Object -First 1
          if (-not $nsi) { Write-Output "::error::CPack left no project.nsi to assert the installer icon on"; exit 1 }
          # CPack writes the path through ConvertToWindowsOutputPath: backslashes, and quotes
          # ONLY when the path holds a space. A runner's D:\a\naudio\... has none, so the line
          # is `!define MUI_ICON D:\a\...\naudio.ico`, unquoted — this gate's first run, on
          # rc9's first cut, matched only the quoted form an older CPack wrote and called a
          # present icon absent. Both forms are accepted; the path is read back with the
          # quotes off and the slashes normalised before it is compared.
          $muiIcon = Select-String -Path $nsi.FullName -Pattern '^!define MUI_ICON\s+"?([^"]+?)"?\s*$' | Select-Object -First 1
          if (-not $muiIcon) { Write-Output "::error::the generated .nsi defines no MUI_ICON — the setup .exe carries NSIS's default icon"; exit 1 }
          $muiIconPath = $muiIcon.Matches[0].Groups[1].Value
          if (($muiIconPath -replace '\\','/') -notmatch 'packaging/icons/naudio\.ico$' -or -not (Test-Path -LiteralPath $muiIconPath)) {
            Write-Output "::error::MUI_ICON is '$muiIconPath', not this checkout's packaging/icons/naudio.ico"; exit 1 }
          if (-not (Select-String -Path $nsi.FullName -Pattern '^!define MUI_UNICON\s+"?[^"]*naudio\.ico"?\s*$' -Quiet)) {
            Write-Output "::error::the generated .nsi defines no MUI_UNICON naming naudio.ico — the uninstaller carries NSIS's default icon"; exit 1 }
          Write-Output "icon: na_audio_daemon.exe carries $daemonIcons icon group(s) (na_wav_tap.exe 0, as the control); setup and uninstaller use $muiIconPath"

          # The daemon, on the installed layout, doing the one thing it can do here without a
          # sound card: refuse a bad config file by name and line. --help alone would prove only
          # that the image loads, and the config reader is the surface item 1 added and item 4
          # will write to, so it is the half worth asserting on a shipped binary.
          Set-Content -Path "$env:TEMP/bad.conf" -Value "junkkey = 1"
          & "$I/bin/na_audio_daemon.exe" --config "$env:TEMP/bad.conf" --mode zzz 2>&1 |
            Tee-Object -FilePath inst-daemon.log
          if ($LASTEXITCODE -ne 2) {
            Write-Output "::error::installed daemon exited $LASTEXITCODE on a bad config; expected 2"; exit 1 }
          if (-not (Select-String -Path inst-daemon.log -Pattern "bad.conf:1: unknown key 'junkkey'" -Quiet)) {
            Write-Output "::error::installed daemon did not name file:line for a bad config key"
            Get-Content inst-daemon.log
            exit 1 }
          # Control: the same binary, the same guard, a VALID config -- it must get past the
          # config reader and fail on the guard instead. Without this, a daemon that refused
          # every invocation would satisfy the assertion above.
          Set-Content -Path "$env:TEMP/ok.conf" -Value "port = 4533"
          & "$I/bin/na_audio_daemon.exe" --config "$env:TEMP/ok.conf" --mode zzz 2>&1 |
            Tee-Object -FilePath inst-daemon-ok.log
          if (-not (Select-String -Path inst-daemon-ok.log -Pattern "invalid --mode" -Quiet)) {
            Write-Output "::error::control failed: a VALID config did not reach the mode guard"
            Get-Content inst-daemon-ok.log
            exit 1 }
          Write-Output "installed daemon reads its config file and refuses a bad one by file:line"

          # Runtime proof on the INSTALLED layout: test-tone server -> null
          # client, byte-tell asserted — same discipline as the ZIP gate.
          $srv = Start-Process -PassThru -NoNewWindow -FilePath "$I/bin/na_audio_source.exe" `
                 -ArgumentList '--test-tone','--seconds','25'
          Start-Sleep -Seconds 3
          & "$I/bin/na_c_play_to_speakers.exe" --backend null --seconds 5 2>&1 |
            Tee-Object -FilePath inst-demo.log
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::installed demo client exited $LASTEXITCODE"; exit 1 }
          if (-not (Select-String -Path inst-demo.log -Pattern 'first_frame_hex=68c569c66ac76bc8' -Quiet)) {
            Write-Output "::error::byte-tell missing — the installed pair did not stream"; exit 1 }
          Stop-Process -Id $srv.Id -ErrorAction SilentlyContinue

          # --- Service registration (#96 item 2, Windows half) ----------------
          # The installer's NSIS section renders the task XML against the chosen
          # $INSTDIR and hands it to schtasks. Everything below is read back from
          # the SCHEDULER, not from the file we wrote: the file being right and
          # the task being registered are different claims.
          $task = Get-ScheduledTask -TaskPath $TaskPath -TaskName $TaskName -ErrorAction SilentlyContinue
          if (-not $task) {
            Write-Output "::error::the installer did not register the logon task"
            & schtasks.exe /Query /TN "$TaskPath$TaskName" 2>&1 | Write-Output
            exit 1 }

          # Installing must not start capturing at the next logon. This is the
          # Windows spelling of systemd's not-enabled state, and it is asserted
          # AS POLICY. (The launchd agent no longer has a key for this — macOS
          # has a system switch, Login Items, and the agent is inert by its
          # arguments instead; see the macOS gate. Windows has no such switch.)
          if ($task.State -ne 'Disabled') {
            Write-Output "::error::the registered task is '$($task.State)', not Disabled — logging in would start capturing"; exit 1 }

          # The three defaults that would break a long-running audio service
          # SILENTLY. Read from the registered task, so a template that had them
          # and an installer that dropped them are distinguishable.
          if ($task.Settings.ExecutionTimeLimit -ne 'PT0S') {
            Write-Output "::error::ExecutionTimeLimit is '$($task.Settings.ExecutionTimeLimit)', not PT0S — the task would be killed after three days"; exit 1 }
          if ($task.Settings.DisallowStartIfOnBatteries) {
            Write-Output "::error::DisallowStartIfOnBatteries is set — the task would refuse to start on a laptop"; exit 1 }
          if ($task.Settings.StopIfGoingOnBatteries) {
            Write-Output "::error::StopIfGoingOnBatteries is set — unplugging would stop the stream"; exit 1 }
          if (-not ($task.Triggers | Where-Object { $_.CimClass.CimClassName -eq 'MSFT_TaskLogonTrigger' })) {
            Write-Output "::error::the task has no logon trigger — it would never start by itself"; exit 1 }

          # It must name a binary THIS install actually placed — the failure a
          # build-tree test structurally cannot see, and the one the operator's
          # choice of install directory is most likely to cause.
          $action = $task.Actions[0]
          if (-not (Test-Path -LiteralPath $action.Execute)) {
            Write-Output "::error::the task runs '$($action.Execute)', which the install did not create"; exit 1 }
          if ($action.Execute -ne "$I\bin\na_audio_daemonw.exe") {
            Write-Output "::error::the task runs '$($action.Execute)', expected $I\bin\na_audio_daemonw.exe (the windowed build)"; exit 1 }
          if ($action.Arguments -notmatch '--mode\s+control') {
            Write-Output "::error::the task does not run --mode control: '$($action.Arguments)'"; exit 1 }

          # The description Task Scheduler shows beside the task is where a Windows operator
          # reads the service's name, and it must be the name the other two platforms show:
          # "Network Audio Service", NAUDIO_APP_NAME in tools/CMakeLists.txt. Read back from the
          # REGISTERED task — the installer re-rendered the template on its own, so the
          # build-tree file the servicecheck arm asserted on is not this one.
          if ($task.Description -notmatch '^Network Audio Service\b') {
            Write-Output "::error::the registered task's description is '$($task.Description)' — it does not lead with the service's name"; exit 1 }

          # BEHAVIOUR: the task's OWN argument list, handed to the installed
          # binary. This is the check that catches a typo'd option — the task
          # would register perfectly and fail only at the operator's next logon.
          # The binary is the windowed build, launched the way the task launches it:
          # Start-Process with no stdout handed over, so the refusal has nowhere to go
          # but the log file — which is the second thing measured here. -Wait, because
          # PowerShell does not wait for a GUI-subsystem process it invoked bare.
          $taskArgs = $action.Arguments.Split(' ') + @('--mode','zzz','--no-config')
          $wlog = "$env:LOCALAPPDATA\naudio\daemon.log"
          if (Test-Path $wlog) { Remove-Item $wlog }
          $pt = Start-Process -Wait -PassThru -FilePath $action.Execute -ArgumentList $taskArgs
          if ($pt.ExitCode -ne 2) {
            Write-Output "::error::the task's own arguments did not parse (exit $($pt.ExitCode))"
            if (Test-Path $wlog) { Get-Content $wlog }; exit 1 }
          if (-not (Test-Path $wlog) -or -not (Select-String -Path $wlog -Pattern "invalid --mode 'zzz'" -Quiet)) {
            Write-Output "::error::the windowed daemon's refusal did not reach its log at $wlog"
            if (Test-Path $wlog) { Get-Content $wlog }; exit 1 }
          Write-Output "logon task registered, disabled, no time limit, battery-safe, running $($action.Execute); its refusals land in $wlog"

          # The windowed build in the task's own mode, for real: control mode on a free port
          # for a few seconds, launched bare. Its log must announce the page — and say what
          # the tray did: "[tray] icon added" when the runner's session has a shell tray,
          # or the note that it has none, either of which is a measurement of the tray code
          # running rather than an assertion about a desktop this job cannot see. The URL
          # is read from the log and the page fetched from it, so the windowed process is
          # proved to serve as the console one does.
          if (Test-Path $wlog) { Remove-Item $wlog }
          $pc = Start-Process -PassThru -FilePath $action.Execute -ArgumentList '--mode','control','--control-port','0','--autostart','false','--no-config','--duration-ms','20000'
          $wurl = $null
          foreach ($attempt in 1..60) {
            if (Test-Path $wlog) {
              $wline = Select-String -Path $wlog -Pattern '^control page : (\S+)' | Select-Object -First 1
              if ($wline) { $wurl = $wline.Matches[0].Groups[1].Value; break }
            }
            Start-Sleep -Milliseconds 250
          }
          if (-not $wurl) {
            Write-Output "::error::the windowed daemon announced no control page in its log"
            if (Test-Path $wlog) { Get-Content $wlog }
            Stop-Process -Id $pc.Id -ErrorAction SilentlyContinue; exit 1 }
          $wpage = (Invoke-WebRequest -UseBasicParsing -Uri $wurl).Content
          if ($wpage -notmatch 'naudio control') {
            Write-Output "::error::the windowed daemon's page is not the control page"
            Stop-Process -Id $pc.Id -ErrorAction SilentlyContinue; exit 1 }
          Start-Sleep -Seconds 2
          $trayLine = Select-String -Path $wlog -Pattern '\[tray\]|no tray icon' | Select-Object -First 1
          if (-not $trayLine) {
            Write-Output "::error::the windowed daemon's log says nothing about the tray icon — the tray code did not run"
            Get-Content $wlog; Stop-Process -Id $pc.Id -ErrorAction SilentlyContinue; exit 1 }
          Write-Output "windowed daemon: serves $wurl from a bare launch; tray: $($trayLine.Line.Trim())"
          Stop-Process -Id $pc.Id -ErrorAction SilentlyContinue

          # --- The control page (#96 item 4) ----------------------------------
          # The Start-menu shortcut is the thing #96's acceptance actually names.
          # It is "Network Audio Service" — the service's name on every platform,
          # the string /Applications holds on a Mac — inside a folder of the same
          # name, which NSIS derives from the installer's Name (CPACK_NSIS_PACKAGE_NAME,
          # the product's name since 2026-09-16; it was "naudio", the library's).
          # Both shell contexts are searched because a silent elevated install
          # writes the all-users menu and a per-user one does not.
          $lnk = @("$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Network Audio Service\Network Audio Service.lnk",
                   "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Network Audio Service\Network Audio Service.lnk") |
                 Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $lnk) {
            Write-Output "::error::no 'Network Audio Service' Start-menu shortcut was created"
            Get-ChildItem "$env:ProgramData\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter *.lnk |
              ForEach-Object { Write-Output "  found: $($_.FullName)" }
            exit 1 }
          $sc = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk)
          if ($sc.TargetPath -ne "$I\bin\na_audio_daemonw.exe") {
            Write-Output "::error::the shortcut points at '$($sc.TargetPath)'"; exit 1 }
          if ($sc.Arguments -notmatch '--mode control' -or $sc.Arguments -notmatch '--open-page') {
            Write-Output "::error::the shortcut does not open the control page: '$($sc.Arguments)'"; exit 1 }
          Write-Output "Start-menu shortcut opens the control page: $lnk"

          # ...and the page really is served by the INSTALLED binary. Hardware-free:
          # control mode opens no device until asked, and nothing here asks.
          $ctlLog = "$env:TEMP\naudio-control.log"
          $ctl = Start-Process -PassThru -NoNewWindow -FilePath "$I\bin\na_audio_daemon.exe" `
                 -ArgumentList '--mode','control','--control-port','0','--autostart','false',
                               '--no-config','--duration-ms','25000' `
                 -RedirectStandardOutput $ctlLog
          # $attempt, NOT $i: PowerShell variable names are CASE-INSENSITIVE, so a loop over
          # $i silently rebinds $I — the install directory every assertion in this step uses.
          # It failed as `An error occurred trying to start process '2/Uninstall.exe'`, an error
          # naming neither the loop nor $I, forty lines below the loop that caused it.
          $url = $null
          foreach ($attempt in 1..60) {
            if (Test-Path $ctlLog) {
              $line = Select-String -Path $ctlLog -Pattern '^control page : (\S+)' | Select-Object -First 1
              if ($line) { $url = $line.Matches[0].Groups[1].Value; break }
            }
            Start-Sleep -Milliseconds 250
          }
          if (-not $url) {
            Write-Output "::error::the installed daemon served no control page"
            if (Test-Path $ctlLog) { Get-Content $ctlLog }; exit 1 }
          $page = (Invoke-WebRequest -UseBasicParsing -Uri $url).Content
          if ($page -notmatch 'naudio control') {
            Write-Output "::error::the installed daemon's page is not the control page"; exit 1 }
          $state = (Invoke-WebRequest -UseBasicParsing -Uri "${url}api/state").Content
          if ($state -notmatch '"state":"idle"') {
            Write-Output "::error::/api/state did not report an idle pipeline: $state"; exit 1 }
          # The page's "Runs at login" row (#102): the installed daemon must see
          # the task the installer registered, and read its Disabled state as
          # the switch being off — the same fact asserted from the scheduler
          # above, now read the way the page reads it (schtasks' CSV listing).
          if ($state -notmatch '"service":\{"manager":"task-scheduler","installed":true,"enabled":false\}') {
            Write-Output "::error::the installed daemon does not see its own disabled logon task: $state"; exit 1 }
          # Control: a port with nothing on it must NOT answer, or the two
          # assertions above would pass on any machine that has a web server.
          $dead = $false
          try { Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:1/' -TimeoutSec 3 | Out-Null }
          catch { $dead = $true }
          if (-not $dead) { Write-Output "::error::control broken: a dead port answered"; exit 1 }
          Stop-Process -Id $ctl.Id -ErrorAction SilentlyContinue
          Write-Output "installed daemon serves its control page and reports an idle pipeline"

          # Payload policy is runtime+tools ONLY.
          foreach ($absent in 'include','lib/naudio.lib','lib/cmake') {
            if (Test-Path "$I/$absent") {
              Write-Output "::error::installer shipped dev path $absent — payload must be runtime+tools only"; exit 1 } }

          # And the uninstaller actually removes what was installed. _?= makes
          # the NSIS uninstaller run synchronously in place (it then cannot
          # delete its own .exe — only the payload is asserted gone).
          # The _?= path contains a space; Start-Process joins -ArgumentList
          # with spaces and no quoting, so the quotes ride inside the string.
          $un = Start-Process -PassThru -Wait -FilePath "$I/Uninstall.exe" -ArgumentList '/S',"`"_?=$I`""
          if ($un.ExitCode -ne 0) { Write-Output "::error::silent uninstall exited $($un.ExitCode)"; exit 1 }
          foreach ($gone in 'bin/na_wav_tap.exe','bin/na_audio_daemon.exe','bin/na_audio_daemonw.exe') {
            if (Test-Path "$I/$gone") { Write-Output "::error::uninstaller left $gone behind"; exit 1 } }
          # ...including the logon task. This is also what would catch the
          # uninstall section running AFTER the payload (and therefore the
          # registration script) had already been deleted.
          if (Get-ScheduledTask -TaskPath $TaskPath -TaskName $TaskName -ErrorAction SilentlyContinue) {
            Write-Output "::error::the uninstaller left the logon task registered"; exit 1 }
          Write-Output "the uninstaller removed the logon task as well as the payload"
          Write-Output "== Windows installer gate: PASS =="

          # THE VERDICT IS THIS STEP'S OWN. Every failure above exits 1 explicitly, so reaching
          # here means every assertion passed — and without this line the step would fail anyway,
          # because a `shell: pwsh` step exits with $LASTEXITCODE, which is set by the last NATIVE
          # command rather than by anything that decided something. This step now runs one on
          # purpose: the task's own arguments are handed to the daemon EXPECTING a non-zero exit.
          # That is L111 wearing a workflow step — a gate that printed PASS and failed anyway.
          # The inherited value is printed rather than silently discarded, so the next reader sees
          # what it was instead of finding a bare `exit 0` and wondering what it hid.
          Write-Output "(gate verdict is explicit; inherited `$LASTEXITCODE was $LASTEXITCODE)"
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: package-windows
          path: |
            build/naudio-*.zip
            build/naudio-*.exe
          if-no-files-found: error

  release:
    name: attach artifacts to the GitHub Release
    runs-on: ubuntu-latest
    needs: [package-macos, package-linux, package-windows]
    # Tag pushes only — a workflow_dispatch run is the dry run and stops at the
    # uploaded workflow artifacts above.
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum naudio-* > sha256sums.txt && cat sha256sums.txt

      - name: Compose the macOS signing sentence from what was measured (#99)
        run: |
          set -euo pipefail
          f=dist/macos-signing-status.txt
          # A MISSING MEASUREMENT IS A FAILURE, NOT A DEFAULT. Falling back to a
          # sentence here would recreate the exact bug: a signing claim the pipeline
          # never established. If package-macos did not measure, this release does not
          # publish a claim about it.
          test -f "$f" || {
            echo "::error::no macOS signing measurement in the artifacts — refusing to describe the .pkg"
            exit 1
          }
          status=$(tr -d '[:space:]' < "$f")
          # The wording itself belongs to signing-status.sh, so the note and the
          # post-signing rewrite cannot drift apart.
          sentence=$(packaging/macos/signing-status.sh --sentence "$status")
          echo "MACOS_SIGNING_SENTENCE=$sentence" >> "$GITHUB_ENV"
          echo "measured '$status' -> $sentence"

      - name: Create (or complete) the Release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # An rc tag publishes a PRERELEASE — visible as such on the Releases
          # page, and excluded from "latest release" until the final tag lands.
          pre=""
          case "$tag" in *rc[0-9]*) pre="--prerelease" ;; esac
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --verify-tag $pre --title "naudio $tag" \
              --notes "Binary packages for $tag. See CHANGELOG.md for what changed. Want it to just work? Take the .pkg (macOS) or the setup .exe (Windows) — double-click installers carrying the runtime library and tools, no build files; on Linux the .deb/.rpm are the equivalent. The Windows installer is unsigned, so SmartScreen warns: choose More info -> Run anyway. ${MACOS_SIGNING_SENTENCE} Developers: the tarballs/ZIP carry headers, pkg-config and the CMake package; DEB/RPM install under /usr, tarballs are relocatable (tools find libnaudio via a relative rpath). The Hamlib bridge (na_hamlib_bridge) is not included: it needs a streaming-capable libhamlib no released Hamlib provides yet, and it will join the packages — linked against the system's real libhamlib — once one does. Until then it builds from source: docs/hamlib-streaming-bridge.md."
          fi
          gh release upload "$tag" dist/naudio-* dist/sha256sums.txt --clobber
          gh release view "$tag" --json assets --jq '.assets[].name'
