name: CI

# Build + test the naudio toolkit on every push and pull request.
# The ctest suite is fully hardware-free (FakeBackend doubles + loopback sockets +
# golden-vector conformance + the README snippet compile-gate), so it runs headless
# on CI runners. The real-hardware smokes (na_audio_daemon / on-air audio) are
# gated out here — they need a real sound device.
#
# Six job families (tri-platform + FetchContent + sanitizers + FFI + the Hamlib bridge):
#   * build-and-test  — Ubuntu + macOS with a SYSTEM PortAudio (the supported path);
#                       full ctest + install smoke + the external-consumer find_package
#                       / pkg-config gate.
#   * windows         — Windows lib-only (tools/ daemon excluded on WIN32 — not built in CI);
#                       PortAudio via FetchContent (no system dep on Windows). Exercises
#                       the Winsock transport path (Socket.cpp ws2_32) that POSIX CI never
#                       compiles.
#   * fetchcontent    — Ubuntu with NO system PortAudio: proves the FetchContent fallback
#                       (build PortAudio v19.7.0 from source) compiles + passes.
#   * sanitizers      — Ubuntu: the same hardware-free ctest suite under ASan+UBSan(+LSan) and
#                       under TSan, via the NAUDIO_SANITIZE option. ~18 thread-creation sites and
#                       five detached per-connection workers had never been run instrumented
#                       (issue #28). Linux-only because LSan does not exist on Darwin. Asserts the
#                       instrumentation is in the BINARY before trusting the run — a sanitizer
#                       reports success by printing nothing, which an uninstrumented build also does.
#   * ffi-clients     — Ubuntu: the Python / Java / Rust example clients, which ctest
#                       never touches. Each hand-declares na_device, so each is diffed
#                       against a C reference compiled from naudio.h. Asserts on matched
#                       output lines, never on exit status — every drift this catches is
#                       one where the client exits 0.
#   * hamlib-bridge   — Ubuntu: na_hamlib_bridge, which until this job had never been compiled
#                       on any platform but one developer's macOS. It is opt-in behind
#                       NAUDIO_BUILD_HAMLIB_BRIDGE and needs a libhamlib exposing rig_stream_*
#                       (Hamlib 5.0+ / PR #2116) that no distro ships, so nothing had ever built
#                       it against glibc or gcc. Builds that dependency from source with the
#                       tracked tools/build-streaming-hamlib.sh, then asserts on the BINARY and
#                       on named passing tests — never on an exit code, because both the skipped
#                       build and the empty test selection exit 0.

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build+test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install PortAudio (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev pkg-config
          # portaudio19-dev provides portaudio-2.0.pc + pulls libasound2-dev, so
          # find_package(PkgConfig) resolves the tested pkg-config path (not the
          # FetchContent fallback). GoogleTest still fetches via FetchContent.

      - name: Install PortAudio (macOS)
        if: runner.os == 'macOS'
        run: brew install portaudio
        # pkg-config deliberately NOT brewed: the runner images preinstall pkgconf
        # (and homebrew's pkg-config is now just an alias of it) — installing it
        # again is at best a no-op and has been a hard conflict on older images.

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build -j

      - name: Test (conformance vectors + README snippet gate)
        run: ctest --test-dir build --output-on-failure

      - name: Install smoke (shared lib + headers + pkg-config + CMake package)
        run: cmake --install build --prefix "${{ runner.temp }}/naudio-prefix"

      - name: External-consumer gate (find_package + pkg-config, C ABI + C++ API)
        run: bash tests/external-consumer/run.sh
        # run.sh installs naudio to its OWN temp prefix (configured with the prefix,
        # so naudio.pc bakes the right paths) and builds+runs a throwaway external
        # project against it via find_package(naudio) AND pkg-config — the real proof
        # that the installed package is consumable.

  windows:
    name: build+test (windows-latest, lib-only, FetchContent PortAudio)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (no system PortAudio -> FetchContent; tools/ excluded on WIN32)
        run: cmake -S . -B build -DNAUDIO_BUILD_APPS=OFF -DCMAKE_INSTALL_PREFIX="${{ runner.temp }}/naudio-prefix"
        # No portaudio-2.0.pc on Windows, so the build fetches + builds PortAudio
        # v19.7.0 from source (MME/WASAPI/DirectSound backends, Windows SDK only).
        # tools/ (the na_audio_daemon hardware smoke) is guarded out by `if(NOT WIN32)` in CMakeLists;
        # NAUDIO_BUILD_APPS=OFF additionally drops the demo exes (na_c_play_to_speakers) — this
        # is a libraries + C ABI + tests build (the C-ABI smokes prove C linkage). The
        # README snippet gate is POSIX-only (bash) and is not registered on WIN32.

      - name: Build
        run: cmake --build build --config RelWithDebInfo -j

      - name: Test (conformance vectors + Winsock loopback smokes)
        run: ctest --test-dir build -C RelWithDebInfo --output-on-failure

      - name: Install (the step this job never had — issue #61)
        run: cmake --install build --config RelWithDebInfo

      - name: External-consumer gate — find_package(naudio) on MSVC, with no pkg-config
        run: |
          # THE gate this job existed without. MSVC has no pkg-config, and
          # naudioConfig.cmake used to open with find_dependency(PkgConfig), so
          # find_package(naudio) failed outright here — on the one platform whose CI
          # build was green. Nothing in this job installed or consumed the package, so
          # nothing could see it. (Issue #61.)
          $prefix = "${{ runner.temp }}/naudio-prefix"

          # The installed export must name no PortAudio target: this is a FetchContent
          # build, so it used to bake in the bare `portaudio_static`, which
          # naudioConfig.cmake had no way to recreate.
          $targets = "$prefix/lib/cmake/naudio/naudioTargets.cmake"
          if (Select-String -Path $targets -Pattern 'portaudio' -Quiet) {
            Write-Output "::error::naudioTargets.cmake names a PortAudio target — it must not (issue #61)"
            Select-String -Path $targets -Pattern 'portaudio'
            exit 1
          }
          Write-Output "naudioTargets.cmake names no PortAudio target — correct"

          cmake -S tests/external-consumer -B consumer-build -DCMAKE_PREFIX_PATH="$prefix" 2>&1 |
            Tee-Object -FilePath consumer.log
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::find_package(naudio) failed on MSVC — issue #61 regressed"
            exit 1
          }
          cmake --build consumer-build --config RelWithDebInfo
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::consumer build failed"; exit 1 }

          # No PortAudio development files on this runner, so the correct outcome is a
          # SKIPPED naudio_pa arm and a package that loads anyway.
          if (-not (Select-String -Path consumer.log -Pattern 'naudio_pa arm SKIPPED' -Quiet)) {
            Write-Output "::error::expected the naudio_pa arm to be SKIPPED on a host with no PortAudio"
            exit 1
          }

          # Assert on OUTPUT, never on exit status: a consumer that fails to start
          # would otherwise be indistinguishable from one that ran and printed nothing.
          $env:PATH = "$prefix/bin;" + $env:PATH
          & "consumer-build/RelWithDebInfo/consume_c.exe"   2>&1 | Tee-Object -FilePath consume.log
          & "consumer-build/RelWithDebInfo/consume_cxx.exe" 2>&1 | Tee-Object -FilePath consume.log -Append
          if (-not (Select-String -Path consume.log -Pattern '^consume_c OK' -Quiet)) {
            Write-Output "::error::consume_c did not run"; exit 1
          }
          if (-not (Select-String -Path consume.log -Pattern '^consume_cxx OK' -Quiet)) {
            Write-Output "::error::consume_cxx did not run"; exit 1
          }

  fetchcontent:
    name: build+test (ubuntu, no system PortAudio -> FetchContent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps (ALSA + pkg-config, NO portaudio19-dev)
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config
          # Deliberately NOT installing portaudio19-dev: with no portaudio-2.0.pc on
          # the system, pkg_check_modules() misses and the build takes the
          # FetchContent path (PortAudio v19.7.0 from source). libasound2-dev is the
          # ALSA backend PortAudio's Linux build links. This is the no-system-deps
          # FetchContent path that CI must exercise.

      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DNAUDIO_BUILD_APPS=OFF \
                -DCMAKE_INSTALL_PREFIX="${{ runner.temp }}/naudio-prefix"
        # CMAKE_INSTALL_PREFIX is set at CONFIGURE time, not left to `--install --prefix`,
        # because naudio.pc bakes the prefix in when it is generated (issue #61).
        # NAUDIO_BUILD_APPS=OFF: the no-system-deps mandate is that the LIBRARIES +
        # C ABI + the full hardware-free ctest build against a FetchContent PortAudio.
        # The demo app (na_audio_daemon) links PortAudio into an executable and is a
        # hardware smoke CI never runs, so it's dropped here; the C-ABI / conformance /
        # snippet ctests still build + run.

      - name: Build
        run: cmake --build build -j

      - name: Test (conformance vectors + README snippet gate)
        run: ctest --test-dir build --output-on-failure

      - name: Install (the step this job never had — issue #61)
        run: cmake --install build
        # Until #61 this job proved the FetchContent build COMPILES and never asked
        # whether the thing it produces can be installed or consumed. Both defects it
        # was blind to were in that gap.

      - name: Assert PortAudio did not leak into the naudio prefix
        run: |
          # PortAudio's own install rules used to run as part of ours, depositing
          # portaudio.h, pa_mac_core.h, libportaudio.a, libportaudio.so,
          # lib/cmake/portaudio/, lib/pkgconfig/portaudio-2.0.pc and
          # share/doc/portaudio/ into naudio's prefix. PA_DISABLE_INSTALL stops it.
          # Assert on the FILES, not on the install step's exit code — the leak was
          # always a clean, successful install.
          # '*portaudio*', not 'portaudio*' — the latter misses libportaudio.a and
          # libportaudio.so, which is most of what actually leaked. The one exclusion is
          # naudio's OWN header, which the glob legitimately matches.
          leaked=$(find "${{ runner.temp }}/naudio-prefix" \
                     \( -iname '*portaudio*' -o -iname 'pa_*.h' \) \
                     -not -path '*/naudio/PortAudioBackend.hpp' || true)
          if [ -n "$leaked" ]; then
            echo "::error::PortAudio leaked into the naudio install prefix:"
            echo "$leaked"
            exit 1
          fi
          echo "no PortAudio artifacts in the prefix — correct"

          # The installed export must name NO PortAudio target. When it named one, it
          # named a target naudioConfig.cmake could not recreate, and every consumer of
          # this build failed with "imported targets are referenced, but are missing".
          if grep -qi portaudio "${{ runner.temp }}/naudio-prefix/lib/cmake/naudio/naudioTargets.cmake"; then
            echo "::error::naudioTargets.cmake names a PortAudio target — it must not (issue #61)"
            grep -in portaudio "${{ runner.temp }}/naudio-prefix/lib/cmake/naudio/naudioTargets.cmake"
            exit 1
          fi
          echo "naudioTargets.cmake names no PortAudio target — correct"

      - name: External-consumer gate on a bundled install (no PortAudio on this host)
        run: |
          # Consume the prefix installed above rather than calling
          # tests/external-consumer/run.sh, which builds and installs naudio itself —
          # here that would mean a SECOND from-source PortAudio build in the same job.
          #
          # This runner has no PortAudio development files at all, which is exactly the
          # case that used to fail: find_package(naudio) must still succeed, the C ABI
          # and C++ consumers must still build, and only the naudio_pa arm drops out.
          set +e
          cmake -S tests/external-consumer -B consumer-build \
                -DCMAKE_PREFIX_PATH="${{ runner.temp }}/naudio-prefix" > consumer.log 2>&1
          rc=$?
          set -e
          cat consumer.log
          if [ $rc -ne 0 ]; then
            echo "::error::find_package(naudio) failed against a bundled install — issue #61 regressed"
            exit 1
          fi
          cmake --build consumer-build -j

          # Assert on the arm's own status line. On this host the correct outcome is
          # SKIPPED, and asserting it is the direct test of the contract #61 settled:
          # a consumer with no PortAudio still gets a loadable package. An ENABLED arm
          # here would mean the runner grew a PortAudio and this job stopped testing
          # the case it exists for.
          grep -q 'external-consumer: naudio_pa arm SKIPPED' consumer.log \
            || { echo "::error::expected the naudio_pa arm to be SKIPPED on a host with no PortAudio"; exit 1; }

          # And the two consumers that must work anyway are asserted on their OUTPUT,
          # never on exit status.
          ./consumer-build/consume_c  > consume.log 2>&1
          ./consumer-build/consume_cxx >> consume.log 2>&1
          cat consume.log
          grep -q '^consume_c OK'   consume.log || { echo "::error::consume_c did not run"; exit 1; }
          grep -q '^consume_cxx OK' consume.log || { echo "::error::consume_cxx did not run"; exit 1; }
        env:
          LD_LIBRARY_PATH: ${{ runner.temp }}/naudio-prefix/lib

  sanitizers:
    name: sanitize (${{ matrix.label }}, ubuntu-latest)
    runs-on: ubuntu-latest
    # Linux-only, and that is a MEASUREMENT rather than the caution the issue anticipated: LSan is
    # unsupported on Darwin (`ASAN_OPTIONS=detect_leaks=1` on arm64 macOS answers "detect_leaks is
    # not supported on this platform"), so the leak half of issue #28 is reachable HERE and in no
    # local run. A developer's green ASan run on macOS is not leak coverage and must not be
    # reported as any.
    #
    # Two configurations, never one: ASan and TSan cannot share a process, which NAUDIO_SANITIZE
    # enforces at configure time. ASan+UBSan is one build (they compose, and LSan rides along with
    # ASan on Linux for free); TSan is the other.
    strategy:
      fail-fast: false
      matrix:
        include:
          - san: address,undefined
            label: asan+ubsan+lsan
          - san: thread
            label: tsan
    steps:
      - uses: actions/checkout@v4

      - name: Install PortAudio (matches the supported build-and-test path)
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev pkg-config
          # Deliberately the SAME dependency shape as build-and-test (ubuntu) so a failure here is
          # attributable to the instrumentation and not to a different build. PortAudio itself is a
          # system library and so is NOT instrumented; ASan still intercepts its allocations.

      - name: Configure (NAUDIO_SANITIZE=${{ matrix.san }})
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -DNAUDIO_SANITIZE=${{ matrix.san }}

      - name: Build
        run: cmake --build build -j

      - name: Assert the instrumentation is actually IN the binary
        run: |
          # The positive control for this whole job (issue #28). A sanitizer's passing result is
          # the ABSENCE of a diagnostic — which is also exactly what a build that silently dropped
          # -fsanitize= produces. Without this step a typo in the flag, a toolchain that ignored
          # it, or a target created above the add_compile_options() call would all report as a
          # clean run forever. Asserts on the SYMBOLS, never on the build's exit code.
          case "${{ matrix.san }}" in
            *address*) want=__asan ;;
            *thread*)  want=__tsan ;;
          esac
          found=$(nm -u build/tests/naudio_net_tests | grep -c "$want" || true)
          echo "undefined ${want} symbols in naudio_net_tests: ${found}"
          [ "$found" -gt 0 ] \
            || { echo "::error::${want} symbols absent — the build is NOT instrumented, so a green run below would mean nothing"; exit 1; }

      - name: Test under ${{ matrix.label }}
        run: ctest --test-dir build --output-on-failure

  ffi-clients:
    name: ffi example clients (python + java + rust vs the C ABI)
    runs-on: ubuntu-latest
    # The Python, Java and Rust example clients each mirror na_device
    # (include/naudio.h) byte-for-byte in a hand-written declaration, and until this
    # job existed nothing built or ran them. Measured on this repo: shifting
    # na_device by 8 bytes left all three printing WRONG device records and exiting
    # 0, while the entire ctest suite stayed green and the install +
    # external-consumer gates passed. See tests/ffi-clients/run.sh.
    #
    # One platform is enough: na_device is all fixed-width ints and char arrays, so
    # its layout is identical everywhere. What varies by platform is the toolchains,
    # and those are what this job pins.
    steps:
      - uses: actions/checkout@v4

      - name: Install PortAudio
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev pkg-config

      - name: Install JDK 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
        # Exactly 22, not the newest available: the Foreign Function & Memory API is
        # final as of 22 and examples/java/README.md documents that as the floor.
        # Building on a newer JDK would stop testing the floor we publish.
        # python3 and cargo are preinstalled on the runner image.

      - name: Configure + build the shared library
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build -j

      - name: FFI gate — each client's own declaration vs the C ABI
        run: |
          # Assert on MATCHED OUTPUT, never on the step's exit code. Every failure
          # mode this gate exists to catch is one where the client exits 0: a padded
          # ctypes struct, a stale MemoryLayout, a #[repr(C)] that drifted. A missing
          # toolchain is the same shape, so the per-language lines below are what
          # make it impossible for an absent JDK or cargo to report green.
          set +e
          bash tests/ffi-clients/run.sh > ffi-clients.log 2>&1
          rc=$?
          set -e
          cat ffi-clients.log
          echo "--- run.sh exited ${rc} (informational; the assertions are on output) ---"

          for lang in python java rust; do
            grep -q "^  ok    ffi-clients: ${lang} layout MATCHES the C truth$" ffi-clients.log \
              || { echo "::error::ffi-clients: no MATCH line for ${lang} — it did not run, or it differs from the C ABI"; exit 1; }
          done

          grep -q "^ffi-clients: 3 probe(s) compared, 0 failure(s)$" ffi-clients.log \
            || { echo "::error::ffi-clients: expected exactly 3 probes and 0 failures"; exit 1; }

          # Not a gate: the device half needs the runner to expose an audio device.
          # Surfaced so a run where it was skipped cannot be mistaken for one where
          # records were actually compared.
          grep "^ffi-clients: device arm" ffi-clients.log

      - name: Upload the manifest comparison log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ffi-clients-log
          path: ffi-clients.log

  hamlib-bridge:
    name: hamlib bridge (ubuntu-latest, libhamlib built from source)
    runs-on: ubuntu-latest
    # Issue #27. na_hamlib_bridge was the one component of naudio that had never been compiled on
    # any platform but one developer's macOS machine — it is pure POSIX C with pthreads that had
    # only ever met clang and macOS libc. The first Linux build found a real defect immediately
    # (hidden visibility silently disabling the fault shim's LD_PRELOAD interposition — see the
    # C_VISIBILITY_PRESET note on naudio_failshim in CMakeLists.txt), which is the class of bug
    # this job exists to catch before a distro packager does.
    #
    # DELIBERATELY NOT CACHED. Caching the libhamlib prefix would make the common run skip
    # build-streaming-hamlib.sh entirely — and running that script on Linux, where its Debian
    # dependency list had never once been executed, is half of what this job is for. A cache hit
    # would report green having exercised neither the script nor the list it advertises.
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps (exactly the list the script and the docs advertise)
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config build-essential portaudio19-dev
          # The first five are precisely what tools/build-streaming-hamlib.sh prints when a tool is
          # missing (:106) and what docs/hamlib-streaming-bridge.md tells a reader to install. That
          # list shipped cross-platform from the start and had never been run on Linux, so this step
          # is itself an assertion: if it is wrong or short, the next step fails.
          # portaudio19-dev is naudio's own dependency, as in build-and-test.

      - name: "Build a streaming-capable libhamlib (Hamlib PR #2116) from source"
        # Quoted: an unquoted '#' after a space starts a YAML comment, which silently truncates
        # this step's name in the Actions UI.
        run: tools/build-streaming-hamlib.sh --prefix "${{ runner.temp }}/hamlib-streaming"
        # Tracks the PR branch HEAD rather than pinning a commit: #2116 is open, and noticing when
        # the streaming API moves out from under the bridge is exactly what this job is worth.
        # docs/hamlib-streaming-bridge.md records that choice and how to pin instead (--ref).
        # The cost of tracking a third-party branch is that an upstream force-push, a rename, or a
        # deleted branch turns this job red for reasons outside naudio. Pin --ref if that bites.
        #
        # This step dominates the job's wall clock. Every figure here was measured by running these
        # steps verbatim in an ubuntu:24.04 amd64 container held to 4 CPUs, the runner's shape:
        # deps 4 s, THIS step 244 s, configure 8 s, build 53 s, bridge tests 31 s — about 5m40s
        # end to end, of which this is three quarters. (Unconstrained at -j18 the same step is
        # 179 s; Hamlib's ~200 backends parallelise well, so it tracks core count.)

      - name: Configure with the bridge enabled
        run: |
          PKG_CONFIG_PATH="${{ runner.temp }}/hamlib-streaming/lib/pkgconfig" \
            cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DNAUDIO_BUILD_HAMLIB_BRIDGE=ON

      - name: Build
        run: cmake --build build -j

      - name: Assert the bridge BINARY exists — never the build's exit code
        run: |
          # Every skip in tools/CMakeLists.txt is a message(WARNING), not a FATAL_ERROR. A
          # NAUDIO_BUILD_HAMLIB_BRIDGE=ON build against a stock libhamlib configures clean, builds
          # clean, exits 0 and produces NO binary, with the warning scrolling past in a few hundred
          # lines of output. So the two steps above passing is not evidence the bridge was built.
          # Only the file is. (This trap has already cost this project one false "bridge enabled".)
          test -x build/tools/na_hamlib_bridge \
            || { echo "::error::na_hamlib_bridge was not built — the target was silently skipped"; exit 1; }

          # Linked against the streaming libhamlib, and able to actually load it: a binary that
          # exists but cannot resolve libhamlib.so at run time would satisfy the check above.
          ldd build/tools/na_hamlib_bridge | grep -i hamlib \
            || { echo "::error::na_hamlib_bridge is not linked against libhamlib"; exit 1; }

          # -h writes to STDERR, so the redirect is load-bearing; without it this greps an empty
          # stream and fails on a perfectly good binary.
          ./build/tools/na_hamlib_bridge -h 2>&1 | grep -q '^usage: .*na_hamlib_bridge' \
            || { echo "::error::na_hamlib_bridge built but will not run"; exit 1; }

      - name: Run the bridge on Linux (naudio_bridge_arm + naudio_bridge_fault_arm)
        run: |
          # Both arms are registered ONLY when na_hamlib_bridge exists as a target, which is what
          # makes them worth running here: the fault arm LD_PRELOADs naudio_failshim to force
          # rig_stream_read/write to fail, and its ELF half had never been compiled anywhere.
          set +e
          ctest --test-dir build -R naudio_bridge --output-on-failure > bridge-ctest.log 2>&1
          rc=$?
          set -e
          cat bridge-ctest.log
          echo "--- ctest exited ${rc} (informational; the assertions are on output) ---"

          # Assert on NAMED PASSING TESTS, not on ctest's exit code. Measured: `ctest -R <pattern>`
          # that matches nothing prints "No tests were found!!!" and exits 0. That is the identical
          # failure this job's binary check exists to catch, one layer down — a silently skipped
          # bridge registers no arms, so an exit-code check reports green having run nothing.
          for t in naudio_bridge_probe_selftest naudio_bridge_arm naudio_bridge_fault_arm; do
            grep -qE "Test +#[0-9]+: ${t} +\.+ +Passed" bridge-ctest.log \
              || { echo "::error::${t} did not run, or did not pass"; exit 1; }
          done

      - name: Upload the bridge test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hamlib-bridge-ctest-log
          path: bridge-ctest.log
